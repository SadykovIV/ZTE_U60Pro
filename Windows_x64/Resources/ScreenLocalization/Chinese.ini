TUForm_FirstUseGDPRTitle_Text="Конфиденциальность"
TUForm_FirstUseGDPRContent_Text="Для обновления системы и правильной работы роутера требуется собирать следующие сведения:\nIMEI, серийный номер и версию ПО.\n\nВы можете загрузить и установить новую версию, чтобы устранить возможные риски для системы. Автообновление позволяет устранять критические сбои и устанавливать исправления безопасности. Эта функция включена по умолчанию. Отключить её можно на устройстве в разделе «Обновление > Автообновление» или в веб-интерфейсе управления: «Обновление > Настройки автопроверки». Обновление расходует мобильный трафик.\n\nНажимая «Принять», вы подтверждаете, что понимаете и принимаете эти условия.\n\nПодробнее о защите данных: #0f87f7 Политика конфиденциальности ZTE.#"
TUForm_FirstUseGDPRContent_CWMP_Text="Для обновления системы и правильной работы роутера требуется собирать следующие сведения:\nIMEI, серийный номер и версию ПО.\n\nВы можете загрузить и установить новую версию, чтобы устранить возможные риски для системы. Автообновление позволяет устранять критические сбои и устанавливать исправления безопасности. Эта функция включена по умолчанию. Отключить её можно на устройстве в разделе «Обновление > Автообновление» или в веб-интерфейсе управления: «Обновление > Настройки автопроверки». Обновление расходует мобильный трафик.\n\nДля удалённого управления мобильным широкополосным устройством по интернет-протоколу CWMP оператор собирает и обрабатывает некоторые ваши персональные данные. Ваши данные находятся под контролем оператора и обрабатываются им; ZTE предоставляет только само устройство.\n\nЗа подробными сведениями о персональных данных, их обработке оператором и ваших правах как субъекта данных обращайтесь к оператору.\n\nНажимая «Принять», вы подтверждаете, что понимаете и принимаете эти условия.\n\nПодробнее о защите данных: #0f87f7 Политика конфиденциальности ZTE.#"
TUForm_FirstUseGDPRPopUp_Text="Откройте веб-интерфейс или страницу по ссылке, чтобы подтвердить согласие.\n\nhttps://ztedevices.com/en-gl/legal/zte-smart-router-privacy-policy/"
