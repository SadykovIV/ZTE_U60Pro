TUForm_FirstUseWelcome_LabelText_PrivacyStatement="Я ознакомился(-ась) с #0f87f7 Политикой конфиденциальности умного роутера ZTE# и принимаю её условия."
TUForm_FirstUseWelcome_LabelText_ImprovementPlan="Я ознакомился(-ась) с #0f87f7 Политикой конфиденциальности программы улучшения сервиса умного роутера ZTE# и принимаю её условия."

TUForm_FirstUseAgreementContent_PrivacyStatement1="Эта политика распространяется только на умные роутеры ZTE Corporation.\n\nПолитика доступна на других языках. При расхождениях преимущественную силу имеет английская версия.\n\nЕсли у вас есть вопросы, замечания или предложения, свяжитесь с нами:\n\nЭл. почта: privacy@zte.com.cn\n\nКомпания: ZTE Corporation\n\nЮридический адрес: ZTE Building, No. 55, Hi-Tech Road South, Nanshan District, Shenzhen, P.R. China "
TUForm_FirstUseAgreementContent_PrivacyStatement2="ZTE понимает, насколько важны для вас персональные данные, и приложит все усилия для их безопасной и надёжной защиты. Чтобы сохранить ваше доверие, мы придерживаемся следующих принципов: соответствие полномочий и ответственности, ясная цель обработки, добровольное согласие, минимально необходимый объём данных, безопасность, участие субъекта данных, открытость и прозрачность. ZTE также обязуется принимать надлежащие меры защиты персональных данных в соответствии с общепринятыми отраслевыми стандартами безопасности. "
TUForm_FirstUseAgreementContent_PrivacyStatement3="Перед использованием наших продуктов или услуг внимательно прочтите эту политику и убедитесь, что понимаете её.\nВ ней описано:\n1. Как мы собираем и используем персональные данные\n2. Как мы предоставляем, передаём и раскрываем персональные данные\n3. Как мы защищаем персональные данные\n4. Ваши права\n5. Как мы обрабатываем персональные данные детей\n6. Как мы передаём персональные данные за рубеж\n7. Особые положения GDPR\n8. Уведомление для потребителей Калифорнии\n9. Как обновляется эта политика "
TUForm_FirstUseAgreementContent_PrivacyStatement4="10. Как с нами связаться\nI. Как мы собираем и используем персональные данные\nПерсональные данные - это сведения, записанные в электронном или ином виде, которые сами по себе или вместе с другими сведениями позволяют установить личность конкретного физического лица либо отражают его действия. ZTE собирает и использует ваши персональные данные только для целей, описанных в этой политике.\nФункция: обновление ПО\nДля своевременного обновления системы и правильной работы роутера необходимо собирать следующие сведения: "
TUForm_FirstUseAgreementContent_PrivacyStatement5="IMEI, серийный номер (SN) и версию ПО роутера.\nЭти данные хранятся на серверах FOTA, развёрнутых ZTE. Поскольку ZTE оказывает услуги по всему миру, серверы FOTA размещены в разных странах. Например, серверы для ЕС находятся во Франкфурте, Германия. Персональные данные, которые мы собираем и формируем в Китайской Народной Республике, хранятся на её территории.\nМы используем ваши персональные данные следующим образом: по предоставленным сведениям о роутере определяем подходящую версию ПО и с вашего разрешения или при выполнении определённых "
TUForm_FirstUseAgreementContent_PrivacyStatement6="условий загружаем и устанавливаем обновление, чтобы устранить возможные риски для системы. Мы также предлагаем автообновление для устранения критических сбоев устройства и установки исправлений безопасности. Эта функция включена по умолчанию. Отключить её можно в разделе «Расширенные настройки > Обновление» веб-интерфейса управления. Обновление расходует мобильный трафик.\nБез этих сведений вы не сможете проверять наличие новых версий ПО, устанавливать обновления и устранять уязвимости текущей системы.\nЕсли мы захотим использовать данные для "
TUForm_FirstUseAgreementContent_PrivacyStatement7="иных целей, не указанных в этой политике, мы заранее запросим ваше согласие. Если мы захотим использовать данные, собранные для определённых целей, в других целях, мы также заранее запросим ваше согласие.\nII. Как мы предоставляем, передаём и раскрываем персональные данные\nДля защиты ваших персональных данных мы соблюдаем принцип минимизации и предоставляем, передаём или раскрываем их в соответствии с применимыми законами и требованиями.\nВ отношении компаний, организаций и физических лиц, обменивающихся с нами персональными данными, мы принимаем организационные и технические меры согласно местным законам и "
TUForm_FirstUseAgreementContent_PrivacyStatement8="нормативным требованиям и требуем, чтобы они обрабатывали персональные данные в соответствии с нашими стандартами безопасности, этой политикой и соответствующими мерами конфиденциальности и защиты.\n1. Предоставление данных\nМы не предоставляем ваши персональные данные компаниям, организациям или физическим лицам за пределами ZTE Corporation и её дочерних компаний, кроме следующих случаев:\n(1) После получения вашего явного согласия мы предоставляем данные другим сторонам.\n(2) Мы можем предоставить данные на основании законов и нормативных актов либо обязательных требований государственных органов."
TUForm_FirstUseAgreementContent_PrivacyStatement9="\n1. Передача данных\nМы не передаём ваши персональные данные другим компаниям, организациям или физическим лицам, кроме следующих случаев:\n(1) Передача с явного согласия: после получения вашего явного согласия мы передаём данные другим сторонам.\n(2) Если передача данных связана со слиянием, поглощением или ликвидацией при банкротстве, мы требуем, чтобы новые компании или организации, получившие данные, продолжали соблюдать эту политику. В противном случае мы требуем, чтобы они заново запросили ваше разрешение."
TUForm_FirstUseAgreementContent_PrivacyStatement10="\nПубличное раскрытие\nМы раскрываем ваши персональные данные только в следующих случаях:\n(1) С вашего явного согласия.\n(2) На основании закона: раскрытие может потребоваться по закону, в рамках правовой процедуры или судебного разбирательства либо по обязательному требованию государственного органа.\nIII. Как мы защищаем персональные данные\n1. Мы применяем меры защиты, соответствующие отраслевым стандартам, чтобы защитить предоставленные вами данные от несанкционированного доступа, публичного раскрытия, использования, изменения, повреждения или утраты. Мы принимаем все разумные и "
TUForm_FirstUseAgreementContent_PrivacyStatement11="осуществимые меры для защиты ваших персональных данных.\nНаши сервисы поддерживают безопасный просмотр по https. Для конфиденциальности данных мы используем шифрование, а для защиты от злоумышленных атак - надёжные защитные механизмы. Мы внедряем контроль доступа, чтобы персональные данные были доступны только уполномоченным сотрудникам. Кроме того, мы обучаем сотрудников вопросам безопасности и конфиденциальности, чтобы они понимали важность защиты персональных данных.\nНаши возможности в области защиты данных:\nМы стремимся "
TUForm_FirstUseAgreementContent_PrivacyStatement12="обеспечить безопасность ваших персональных данных.\nМы применяем контроль доступа, мониторинг, шифрование, обезличивание или псевдонимизацию, обучение сотрудников и другие меры, чтобы защитить данные от несанкционированного доступа, использования, раскрытия, изменения, повреждения, утраты и иных видов незаконной обработки.\nМы разработали план обеспечения непрерывности деятельности для бесперебойного оказания услуг. Наши правила и процедуры информационной безопасности строго соответствуют международным стандартам. Они регулярно пересматриваются и "
TUForm_FirstUseAgreementContent_PrivacyStatement13="обновляются, а эффективность системы управления безопасностью и защитных мер проверяется независимыми аудитами. ZTE Corporation и некоторые её дочерние компании сертифицированы по стандарту информационной безопасности ISO 27001 и способны эффективно защищать ваши персональные данные. При утечке данных мы запускаем план экстренного реагирования, принимаем меры, чтобы предотвратить ухудшение ситуации, и своевременно уведомляем вас и соответствующий надзорный орган.\nМы принимаем все разумные и осуществимые меры, чтобы не собирать данные, не относящиеся к целям обработки. Мы храним ваши персональные "
TUForm_FirstUseAgreementContent_PrivacyStatement14="данные только столько, сколько необходимо для достижения целей этой политики, если более длительное хранение не требуется или не разрешено законом.\nИнтернет не обеспечивает абсолютной безопасности. Большинство сообщений, включая электронную почту и мгновенные сообщения, не шифруется. Мы настоятельно рекомендуем не передавать персональные данные такими способами. Используйте сложный пароль, чтобы помочь нам защитить вашу учётную запись.\nМы регулярно обновляем и публикуем сведения об отчётах по рискам безопасности, оценке влияния на безопасность персональных данных и другим вопросам. Если отчёт об оценке безопасности затрагивает ваши права в отношении персональных "
TUForm_FirstUseAgreementContent_PrivacyStatement15="данных, мы открыто сообщаем о рисках. Подробное содержание отчёта можно получить по адресу:\nЭл. почта: privacy@zte.com.cn\nИнтернет не является полностью безопасной средой. Мы приложим все усилия, чтобы обеспечить безопасность любых переданных нам сведений. Если повреждение наших физических, технических или организационных средств защиты приведёт к несанкционированному доступу, публичному раскрытию, изменению или повреждению данных и нарушит ваши законные права и интересы, мы понесём соответствующую юридическую ответственность.\nПри инциденте с безопасностью персональных данных мы своевременно сообщим вам "
TUForm_FirstUseAgreementContent_PrivacyStatement16="основные сведения о нём и его возможных последствиях, о принятых или планируемых мерах, о том, как самостоятельно предотвратить и уменьшить риски, а также о мерах по устранению последствий для вас. Мы уведомим вас по электронной почте, письмом, по телефону или push-уведомлением. Если уведомить каждого субъекта данных отдельно затруднительно, мы опубликуем извещение разумным и действенным способом.\nКроме того, мы сообщим о ходе урегулирования инцидента в соответствии с требованиями надзорного органа. "
TUForm_FirstUseAgreementContent_PrivacyStatement17="IV. Ваши права\nВ соответствии с законами, нормативными актами и стандартами защиты персональных данных, а также общепринятой практикой других стран и регионов мы гарантируем следующие права в отношении ваших данных.\nДоступ к персональным данным\nВы имеете право на доступ к своим персональным данным, кроме предусмотренных законом исключений. Для реализации этого права можно воспользоваться следующими способами:\nНапишите на privacy@zte.com.cn. Мы ответим на запрос в течение 15 рабочих дней.\nЕсли получить доступ к этим персональным "
TUForm_FirstUseAgreementContent_PrivacyStatement18="данным таким способом не удаётся, войдите в систему обработки запросов субъектов данных pdsr.zte.com.cn и отправьте запрос. Если это не потребует чрезмерных усилий с нашей стороны, мы также предоставим другие ваши персональные данные, сформированные при использовании наших продуктов или услуг.\nИсправление персональных данных\nЕсли вы обнаружили ошибку в обрабатываемых нами данных, вы вправе потребовать её исправления. Подать запрос можно способом, указанным в пункте «(1) Доступ к персональным данным». Если исправить данные этим способом не удаётся, вы можете в любое время отправить запрос через систему обработки запросов субъектов "
TUForm_FirstUseAgreementContent_PrivacyStatement19="данных pdsr.zte.com.cn.\nУдаление персональных данных\nВы можете потребовать удалить персональные данные, если:\n(1) Мы нарушили законы или нормативные требования.\n(2) Мы не получили вашего согласия.\n(3) Мы нарушили соглашение с вами.\n(4) Вы больше не используете наши продукты или услуги либо ваша учётная запись закрыта.\n(5) Мы больше не предоставляем вам продукты или услуги.\nЕсли мы решим удовлетворить запрос на удаление, мы также уведомим получателей ваших данных и потребуем от них "
TUForm_FirstUseAgreementContent_PrivacyStatement20="своевременно удалить их, если иное не предусмотрено законом либо эти получатели не получили отдельное разрешение от вас. После удаления данных их копии в резервной системе могут сохраняться некоторое время; мы удалим их при обновлении резервных копий.\nПолучение копии персональных данных\nВы вправе получить копию своих персональных данных. Для этого можно самостоятельно выполнить следующие действия:\nЗапросите копию способом, указанным в пункте «(1) Доступ к "
TUForm_FirstUseAgreementContent_PrivacyStatement21="персональным данным». Если получить её таким способом не удаётся, в любое время отправьте запрос через систему обработки запросов субъектов данных pdsr.zte.com.cn.\nПри наличии технической возможности, например совместимых интерфейсов обмена, мы можем передать копию ваших данных непосредственно указанной вами третьей стороне.\nОграничение автоматического принятия решений\nВ некоторых функциях решения могут приниматься без участия человека, только средствами информационных систем и алгоритмов. Если такие решения существенно затрагивают "
TUForm_FirstUseAgreementContent_PrivacyStatement22="ваши законные права и интересы, вы вправе потребовать разъяснения, а мы предоставим надлежащие способы защиты ваших прав.\nОтветы на ваши запросы\nВ целях безопасности вам может потребоваться подать письменный запрос или подтвердить личность другим способом. Мы можем запросить подтверждение личности перед обработкой обращения.\nМы приложим все усилия, чтобы ответить в течение одного месяца со дня получения запроса. С учётом сложности и количества запросов этот срок при необходимости может быть продлён ещё на два месяца. При задержке мы уведомим вас об обстоятельствах и "
TUForm_FirstUseAgreementContent_PrivacyStatement23="причинах продления. Если указанный здесь срок противоречит местным законам и нормативным актам, применяются местные требования.\nКак правило, разумные запросы выполняются бесплатно, однако за повторные обращения сверх разумного предела взимается плата. Мы можем отклонить необоснованно повторяющиеся запросы, обращения, требующие чрезмерных технических усилий (например, разработки новой системы или коренного изменения существующей практики), создающие риск для законных прав и интересов других лиц либо практически невыполнимые (например, связанные с данными на резервной магнитной ленте). "
TUForm_FirstUseAgreementContent_PrivacyStatement24="В соответствии с законами и нормативными актами мы не сможем выполнить ваш запрос, если:\n(1) Он непосредственно связан с национальной безопасностью и обороной.\n(2) Он непосредственно связан с общественной безопасностью, здравоохранением или значимыми общественными интересами.\n(3) Он непосредственно связан с уголовным расследованием, преследованием, судебным разбирательством или исполнением приговора.\n(4) Есть достаточные доказательства злого умысла или злоупотребления правами с вашей стороны.\n(5) Выполнение запроса серьёзно нарушит ваши законные права и интересы либо права и интересы других лиц и организаций. "
TUForm_FirstUseAgreementContent_PrivacyStatement25="(6) Запрос затрагивает коммерческую тайну.\nV. Как мы обрабатываем персональные данные детей\nНаши продукты, сайты и услуги предназначены главным образом для взрослых. Дети не вправе создавать учётные записи без согласия родителей или опекунов.\nЕсли данные ребёнка собраны с согласия родителей, мы используем или раскрываем их только в случаях, разрешённых законом, с явного согласия родителей или опекунов либо когда это необходимо для защиты ребёнка.\nХотя местные законы и обычаи по-разному определяют детский возраст, мы считаем ребёнком любого человека младше 16 лет.\nЕсли мы обнаружим, что собрали "
TUForm_FirstUseAgreementContent_PrivacyStatement26="персональные данные ребёнка без подтверждённого согласия родителей, мы постараемся удалить их как можно скорее.\nVI. Как мы передаём персональные данные за рубеж\nМы предоставляем продукты и услуги с помощью ресурсов и серверов по всему миру. Поэтому ваши данные могут передаваться за пределы страны или региона, где вы используете продукт или услугу, либо быть доступны из другой юрисдикции. Любая такая передача допускается только в соответствии с применимым законодательством.\nПри обработке персональных данных мы принимаем меры для соблюдения всех применимых местных законов, "
TUForm_FirstUseAgreementContent_PrivacyStatement27="включая условия и ограничения на передачу данных. Мы также можем защищать данные другими юридически действительными способами, в том числе международными соглашениями о передаче данных.\nVII. Особые положения GDPR\nСледующие положения применяются только к лицам, проживающим в Европе.\n1. Правовые основания обработки персональных данных\nОбработка данных, описанная в разделе «Как мы собираем и используем персональные данные», осуществляется на следующих правовых основаниях:\n1.1. Согласие. Мы можем обрабатывать данные с вашего согласия. В частности, мы можем запросить ваше "
TUForm_FirstUseAgreementContent_PrivacyStatement28="согласие на участие в рекламных мероприятиях, например на получение рекламных сообщений, участие в программе улучшения пользовательского опыта и использование отдельных услуг, в том числе связанных со сбором данных о местоположении. Вы вправе не давать согласие или отозвать его в любое время. Отзыв не влияет на правомерность использования данных до его получения. Если вы дали согласие, мы используем данные только для целей, указанных в заявлении о согласии. Если обработка основана на согласии, а вы не предоставите его или "
TUForm_FirstUseAgreementContent_PrivacyStatement29="отзовёте, мы можем утратить возможность предоставлять соответствующую услугу. Помимо этого, отказ или отзыв согласия не повлечёт для вас отрицательных последствий.\n1.2. Заключение или исполнение договора с вами.\nМы опираемся на это основание, в частности, чтобы:\n- Предоставлять услуги ZTE, обрабатывать заказы и исполнять договор между вами и ZTE.\n- Активировать приобретённые услуги, гарантийное обслуживание и отдельные лицензии на ПО, а также уведомлять об обновлениях ПО.\n- Обеспечивать и организовывать ваше участие в проводимых нами розыгрышах, конкурсах и других подобных рекламных "
TUForm_FirstUseAgreementContent_PrivacyStatement30="мероприятиях.\n- Выявлять неполадки, ремонтировать оборудование клиентов и оказывать другие услуги обслуживания и поддержки.\n1.3. Исполнение требований закона. ZTE может быть обязана обрабатывать персональные данные для исполнения правовых обязанностей, например хранить сведения для исполнения налогового законодательства или в коммерческих целях.\n1.4. Законные интересы. Обработка данных также может быть необходима для законных интересов ZTE. В частности, чтобы:\n- Проводить опросы клиентов для улучшения пользовательского опыта.\n- Анализировать потребительский рынок с учётом "
TUForm_FirstUseAgreementContent_PrivacyStatement31="страны, в которой вы пользуетесь нашими услугами, включая число пользователей, для маркетинга и продвижения продуктов.\n- Анализировать эффективность нашей деятельности.\n- Анализировать журналы ошибок для повышения качества телефонов и улучшения функций приложений.\n- Предоставлять персонализированные услуги, рекомендовать и показывать подходящие вам материалы и рекламу в наших сервисах.\n- Общаться с вами и отвечать на вопросы и замечания, переданные любым способом.\n- Обеспечивать работоспособность и безопасность наших услуг.\n- Проверять вашу личность.\n- Проводить внутренний аудит, предотвращать и "
TUForm_FirstUseAgreementContent_PrivacyStatement32="расследовать мошенничество, киберугрозы и другие злоупотребления.\n- Совершенствовать и развивать услуги, включая функции безопасности, улучшая опыт использования, удобство, производительность, функции и дизайн продуктов.\n- Предъявлять юридические требования или защищаться от них.\nМы обрабатываем данные на этих основаниях только после надлежащей оценки и сопоставления наших интересов с вашим правом на неприкосновенность частной жизни.\n2. Дополнительные сведения о правах в отношении персональных данных\nПри соблюдении предусмотренных GDPR условий вы имеете "
TUForm_FirstUseAgreementContent_PrivacyStatement33="следующие права.\nПраво на доступ. Вы можете запросить доступ к имеющимся у нас данным о вас.\nПраво на исправление. Если обрабатываемые нами данные неточны или неполны, вы вправе потребовать без неоправданной задержки исправить их и при необходимости дополнить.\nПраво на удаление. Вы можете потребовать удалить данные. В определённых обстоятельствах мы обязаны сделать это без неоправданной задержки, например если у нас больше нет законного основания для обработки в объёме, предусмотренном применимыми законами и "
TUForm_FirstUseAgreementContent_PrivacyStatement34="нормативными актами. Обратите внимание: удаление всех данных с устройства не означает удаления всех сведений о вас, которые собирает и обрабатывает ZTE. Поэтому для удаления персональных данных рекомендуем обратиться к нам (см. раздел «Как с нами связаться»).\nПраво на ограничение обработки. В определённых обстоятельствах вы вправе потребовать от ZTE временно ограничить обработку, например на время проверки точности данных, которые вы оспариваете. Мы сохраним лишь необходимый объём данных или будем обрабатывать их только в той мере, которая нужна для "
TUForm_FirstUseAgreementContent_PrivacyStatement35="соблюдения вашего требования об ограничении в дальнейшем.\nПРАВО НА ВОЗРАЖЕНИЕ. Вы вправе в любое время возразить против обработки на основании законных интересов по причинам, связанным с вашей конкретной ситуацией. В этом случае мы прекратим обработку ваших данных, если не докажем наличие веских оснований, преобладающих над вашими интересами, правами и свободами, либо необходимость установления, осуществления или защиты наших юридических требований. Вы можете в любое время и по любой причине возразить против прямого маркетинга. "
TUForm_FirstUseAgreementContent_PrivacyStatement36="Право на переносимость данных. Вы вправе получить копию своих данных в структурированном, общепринятом и машиночитаемом формате и передать её другому поставщику услуг либо, при определённых обстоятельствах, поручить нам такую передачу.\nПраво на отзыв согласия. Если вы дали согласие на обработку, а затем изменили решение, вы вправе отозвать его в любое время. Это не влияет на правомерность использования данных до отзыва. Чтобы отказаться от рекламных сообщений, вы можете "
TUForm_FirstUseAgreementContent_PrivacyStatement37="отписаться способом, указанным в каждом таком сообщении. После отзыва согласия мы можем утратить возможность предоставлять соответствующую услугу.\nПраво на жалобу. Вы вправе подать жалобу на порядок обработки данных в компетентный надзорный орган или обратиться в суд надлежащей юрисдикции. Контактные сведения местных органов защиты данных доступны по адресу https://edpb.europa.eu/about-edpb/board/members_en.\n3. Дополнительные сведения о трансграничной передаче "
TUForm_FirstUseAgreementContent_PrivacyStatement38="При передаче данных за пределы Европейской экономической зоны мы принимаем меры, чтобы обеспечить надлежащую техническую и организационную защиту и сохранить права на конфиденциальность, предусмотренные этой политикой. Мы внедрили стандартные договорные положения Европейской комиссии как средство обеспечения надлежащей защиты данных, которые обрабатываем по всему миру. При любой передаче персональных данных мы обеспечиваем гарантии, предусмотренные нормативными требованиями.\nVIII. Уведомление для потребителей Калифорнии\nПотребители Калифорнии имеют перечисленные ниже права на конфиденциальность. Права, "
TUForm_FirstUseAgreementContent_PrivacyStatement39="предоставляемые законом Калифорнии о защите конфиденциальности потребителей и законом Shine the Light, различаются. Для реализации прав следуйте приведённым ниже указаниям, относящимся к соответствующему закону.\nЗакон Калифорнии о защите конфиденциальности потребителей (CCPA)\nCCPA предусматривает отдельные исключения для данных, которые мы собираем при предоставлении продуктов или услуг другим компаниям. Он также не применяется к сведениям, полученным в связи со статусом соискателя, сотрудника или подрядчика ZTE. В отношении данных, собранных в этих обстоятельствах или об указанных лицах, вам могут "
TUForm_FirstUseAgreementContent_PrivacyStatement40="не предоставляться некоторые или все перечисленные ниже права.\nСбор, использование и раскрытие данных за последние 12 месяцев\nCCPA обязывает нас раскрывать определённые общие сведения о сборе, использовании и раскрытии данных за последние 12 месяцев. За этот период:\nМы собирали категории данных, указанные выше в разделе о сборе и использовании персональных данных.\n[Мы не продавали персональные данные в том смысле, в котором термин «продажа» используется в CCPA и подзаконных актах.][Мы продали получателям, "
TUForm_FirstUseAgreementContent_PrivacyStatement41="указанным в разделе о предоставлении, передаче и раскрытии данных, следующие категории персональных данных: [●]].\n[Мы не раскрывали персональные данные никаким получателям.][Мы раскрыли получателям, указанным в разделе о предоставлении, передаче и раскрытии данных, следующие категории персональных данных: [●]].\nВы вправе запросить более подробные сведения о ваших данных, как описано ниже в пункте «Запрос сведений».\nПрава на конфиденциальность в Калифорнии\nСогласно CCPA вы имеете следующие права. "
TUForm_FirstUseAgreementContent_PrivacyStatement42="Запрос сведений. Вы вправе узнать о нашей деятельности за последние 12 месяцев: (i) конкретные сведения о вас, которые мы собрали; (ii) категории собранных данных; (iii) категории источников этих данных; (iv) категории третьих сторон, которым мы предоставляем данные; (v) категории проданных или раскрытых данных о вас и для каждой категории - категории третьих сторон, которым мы продали или раскрыли эти данные; (vi) наши деловые или коммерческие "
TUForm_FirstUseAgreementContent_PrivacyStatement43="цели сбора или продажи ваших персональных данных.\nВы можете бесплатно подавать такие запросы дважды в год. Если мы не можем выполнить запрос, мы сообщим причину. При ответе запрещено раскрывать ваш номер социального страхования, водительского удостоверения или другого государственного документа, номер финансового счёта, медицинской страховки или медицинского идентификатора, пароль учётной записи, контрольные вопросы и ответы, а также уникальные биометрические данные, полученные измерением или техническим анализом характеристик человека. "
TUForm_FirstUseAgreementContent_PrivacyStatement44="Запрос на удаление. Вы вправе потребовать удалить собранные у вас персональные данные. В некоторых обстоятельствах мы можем отказать, например для исполнения требований закона или завершения операции, для которой были собраны данные. В случае отказа мы сообщим причину.\nПраво на отказ от продажи данных. Вы вправе отказаться от продажи своих персональных данных. Хотя мы никогда не обмениваем их на деньги или иное вознаграждение, определение «продажи» в CCPA очень широкое и может включать использование "
TUForm_FirstUseAgreementContent_PrivacyStatement45="сервисов показа рекламы с учётом ваших интересов. Мы не продаём данные без согласия родителя или опекуна, если нам известно, что они относятся к ребёнку младше 13 лет. Если нам известно, что данные относятся к несовершеннолетнему от 13 до 16 лет, мы не продаём их без его согласия. Если вы совершеннолетний и не заявили об отказе, ваши данные могут продаваться в порядке, описанном в этой политике.\nПраво на отсутствие дискриминации. Реализация любого из этих прав не станет основанием для дискриминации. Однако при реализации отдельных прав некоторые функции приложения могут стать недоступны. "
TUForm_FirstUseAgreementContent_PrivacyStatement46="Чтобы запросить сведения или удаление данных, позвоните по номеру 001-877-817-1759 или напишите на privacy@zte.com.cn. Если вы уполномоченный представитель жителя Калифорнии, используйте номер 001-877-817-1759 или адрес privacy@zte.com.cn.\nДля отказа от продажи данных позвоните по номеру 001-877-817-1759 или напишите на privacy@zte.com.cn. Если вы уполномоченный представитель жителя Калифорнии, используйте номер 001-877-817-1759 или адрес privacy@zte.com.cn.\nПрежде чем обработать запрос сведений или запрос на удаление, мы примем меры для проверки вашей личности. "
TUForm_FirstUseAgreementContent_PrivacyStatement47="Мы не выполним запрос, пока не получим достаточно сведений, чтобы обоснованно убедиться, что вы и есть человек, чьи данные были собраны. Если у вас есть учётная запись, мы используем действующие способы её аутентификации. Если учётной записи нет, мы можем запросить дополнительные сведения для подтверждения личности. Мы используем предоставленные сведения только для проверки личности и обработки запроса, если изначально вы не передали их для другой цели.\nВы можете поручить уполномоченному представителю подать запрос сведений или запрос "
TUForm_FirstUseAgreementContent_PrivacyStatement48="на удаление. При проверке такого обращения мы можем проверить личности и вашу, и представителя, а также запросить подписанный вами документ о его полномочиях. Для защиты ваших данных мы вправе отклонить обращение представителя, не подтвердившего право действовать от вашего имени.\nShine the Light\nПотребители Калифорнии также могут раз в календарный год запрашивать сведения о персональных данных, предоставленных третьим сторонам для их собственного прямого маркетинга, включая категории данных, названия и "
TUForm_FirstUseAgreementContent_PrivacyStatement49="адреса компаний-получателей. Для этого напишите на privacy@zte.com.cn или позвоните по номеру 001-877-817-1759. В теме электронного письма или первой строке обычного письма укажите «Shine the Light Request», а также сообщите имя, улицу и номер дома, город, штат и почтовый индекс.\nIX. Как обновляется эта политика\nНаша политика может изменяться.\nБез вашего явного согласия мы не будем сокращать предусмотренные ею права.\nВсе изменения будут опубликованы на этой странице. О существенных изменениях мы дополнительно сообщим более заметными "
TUForm_FirstUseAgreementContent_PrivacyStatement50="уведомлениями, в том числе для отдельных услуг - электронным письмом с описанием конкретных изменений.\nК существенным изменениям относятся, в частности:\nЗначительное изменение модели предоставления услуг, например целей обработки, видов данных или способов их использования.\nСущественные изменения структуры собственности или организации, например смена владельцев при реорганизации деятельности, банкротстве, слиянии или поглощении. "
TUForm_FirstUseAgreementContent_PrivacyStatement51="Изменение основных получателей данных при их предоставлении, передаче или публичном раскрытии.\nСущественное изменение ваших прав на участие в обработке данных или способов реализации этих прав.\nИзменение подразделения, отвечающего за безопасность персональных данных, контактных данных или канала подачи жалоб.\nВыявление высокого риска в отчёте об оценке влияния на безопасность персональных данных.\nМы также сохраним прежнюю версию политики в архиве для вашего ознакомления.\nX. Как с нами связаться\nМы создали специальное подразделение по защите персональных "
TUForm_FirstUseAgreementContent_PrivacyStatement52="данных - Data Protection Compliance Dept. Если у вас есть вопросы, замечания или предложения по этой политике, напишите на privacy@zte.com.cn. Мы ответим в надлежащий срок.\nВы также можете направить письмо в подразделение по соблюдению требований защиты данных в штаб-квартире ZTE.\nПолучатель: Data Protection Compliance Dept. of ZTE Corporation\nАдрес: 26/F, R&D Building, No. 55, Hi-Tech Road South, Shenzhen, China (Post Code: 518057)\nЕсли вы недовольны нашим ответом, особенно если обработка данных нарушила ваши законные "
TUForm_FirstUseAgreementContent_PrivacyStatement53="права и интересы, вы можете обратиться в местный орган защиты данных.\nКонтактные сведения надзорных органов других регионов можно получить у местных властей. Контакты органов защиты данных Европейского союза доступны по адресу: https://ec.europa.eu/justice/article-29/structure/data-protection-authorities/index_en.htm"


TUForm_FirstUseAgreementContent_ImprovementPlan1="Эта политика распространяется только на умные роутеры ZTE Corporation и все сторонние приложения и услуги, доступные через них. Если у стороннего приложения или услуги есть своя политика конфиденциальности, она имеет преимущественную силу. По вопросам, не охваченным такой политикой, применяется эта политика.\n\nПолитика доступна на других языках. При расхождениях преимущественную силу имеет английская версия.\n\nЕсли у вас есть вопросы, замечания или предложения, свяжитесь с нами:\n\nЭл. почта: privacy@zte.com.cn\n\nКомпания: "
TUForm_FirstUseAgreementContent_ImprovementPlan2="ZTE Corporation\n\nЮридический адрес: ZTE Building, No. 55, Hi-Tech Road South, Nanshan District, Shenzhen, P.R. China\nZTE понимает, насколько важны для вас персональные данные, и приложит все усилия для их безопасной и надёжной защиты. Чтобы сохранить ваше доверие, мы придерживаемся следующих принципов: соответствие полномочий и ответственности, ясная цель обработки, добровольное согласие, минимально необходимый объём данных, безопасность, участие субъекта данных, открытость и прозрачность. ZTE также обязуется принимать надлежащие меры защиты персональных данных в соответствии "
TUForm_FirstUseAgreementContent_ImprovementPlan3="с общепринятыми отраслевыми стандартами безопасности.\nПеред использованием наших продуктов или услуг внимательно прочтите эту политику и убедитесь, что понимаете её.\nВ ней описано:\n1. Как мы собираем и используем персональные данные\n2. Как мы предоставляем, передаём и раскрываем персональные данные\n3. Как мы защищаем персональные данные\n4. Ваши права\n5. Как мы обрабатываем персональные данные детей\n6. Как мы передаём персональные данные за рубеж\n7. Особые положения GDPR\n8. Уведомление для "
TUForm_FirstUseAgreementContent_ImprovementPlan4="потребителей Калифорнии\n9. Как обновляется эта политика\n10. Как с нами связаться\nI. Как мы собираем и используем персональные данные\nПерсональные данные - это сведения, записанные в электронном или ином виде, которые сами по себе или вместе с другими сведениями позволяют установить личность конкретного физического лица либо отражают его действия. ZTE собирает и использует ваши персональные данные только для целей, описанных в этой политике.\nЧтобы точнее выявлять возможные неполадки роутера и обеспечивать его нормальную и стабильную работу, мы собираем и "
TUForm_FirstUseAgreementContent_ImprovementPlan5="храним следующие сведения: MAC-адрес устройства, согласованную скорость соединения, RSSI, сведения о перезапусках, время начала и окончания обновлений CPE FOTA, случаи успешной регистрации в сети, уровень сигнала, изменения типа сети, случаи потери сети, подключения и отключения PDP, переходы между сотами (CELL) и время подключения сетевого кабеля.\nМы используем данные следующим образом: если вы сдаёте устройство в ремонт, собранные сведения выгружаются в пункте послепродажного обслуживания и передаются в сервисный центр для выявления неисправности. Эта функция по умолчанию отключена и начинает действовать "
TUForm_FirstUseAgreementContent_ImprovementPlan6="только после вашего согласия на её включение. Отключить её можно в веб-интерфейсе: «Расширенные настройки > Настройки системы > Программа улучшения сервиса». При этом мы удалим локальные данные с вашего устройства.\nБез этих данных причину отдельных периодически возникающих неполадок может быть трудно установить, что влияет на использование устройства. Мы настоятельно рекомендуем включить эту функцию.\nЭти сведения хранятся на сервере управления послепродажным обслуживанием ZTE. Европейский сервер находится во Франкфурте, Германия. Персональные данные, собранные и "
TUForm_FirstUseAgreementContent_ImprovementPlan7="сформированные в Китайской Народной Республике, хранятся на её территории. По возможности ваши данные хранятся на сервере соответствующего региона. При необходимости диагностики сведения могут передаваться из места сбора на сервер в Китае для анализа неисправностей. Согласие с этой политикой означает согласие на трансграничную передачу данных. Чтобы эта услуга была доступна в течение гарантийного срока, указанные данные хранятся два года и удаляются по его истечении.\nЕсли мы захотим использовать данные для иных целей, не указанных в этой политике, мы заранее запросим ваше согласие. Если мы захотим использовать данные, "
TUForm_FirstUseAgreementContent_ImprovementPlan8="собранные для определённых целей, в других целях, мы также заранее запросим ваше согласие.\nII. Как мы предоставляем, передаём и раскрываем персональные данные\nДля защиты ваших персональных данных мы соблюдаем принцип минимизации и предоставляем, передаём или раскрываем их в соответствии с применимыми законами и требованиями.\nВ отношении компаний, организаций и физических лиц, обменивающихся с нами персональными данными, мы принимаем организационные и технические меры согласно местным законам и нормативным требованиям и требуем, чтобы они обрабатывали персональные данные в соответствии с нашими "
TUForm_FirstUseAgreementContent_ImprovementPlan9="стандартами безопасности, этой политикой и соответствующими мерами конфиденциальности и защиты.\n1. Предоставление данных\nМы не предоставляем ваши персональные данные компаниям, организациям или физическим лицам за пределами ZTE Corporation и её дочерних компаний, кроме следующих случаев:\n(1) После получения вашего явного согласия мы предоставляем данные другим сторонам.\n(2) Мы можем предоставить данные на основании законов и нормативных актов либо обязательных требований государственных органов. \n2. Передача данных\nМы "
TUForm_FirstUseAgreementContent_ImprovementPlan10="не передаём ваши персональные данные другим компаниям, организациям или физическим лицам, кроме следующих случаев:\n(1) Передача с явного согласия: после получения вашего явного согласия мы передаём данные другим сторонам.\n(2) Если передача данных связана со слиянием, поглощением или ликвидацией при банкротстве, мы требуем, чтобы новые компании или организации, получившие данные, продолжали соблюдать эту политику. В противном случае мы требуем, чтобы они заново запросили ваше разрешение. \n3. Публичное раскрытие\nМы раскрываем ваши персональные данные только в следующих случаях:\n(1) "
TUForm_FirstUseAgreementContent_ImprovementPlan11="С вашего явного согласия.\n(2) На основании закона: раскрытие может потребоваться по закону, в рамках правовой процедуры или судебного разбирательства либо по обязательному требованию государственного органа.\nIII. Как мы защищаем персональные данные\n1. Мы применяем меры защиты, соответствующие отраслевым стандартам, чтобы защитить предоставленные вами данные от несанкционированного доступа, публичного раскрытия, использования, изменения, повреждения или утраты. Мы принимаем все разумные и осуществимые меры для защиты ваших персональных данных.\nНаши сервисы поддерживают "
TUForm_FirstUseAgreementContent_ImprovementPlan12="безопасный просмотр по https. Для конфиденциальности данных мы используем шифрование, а для защиты от злоумышленных атак - надёжные защитные механизмы. Мы внедряем контроль доступа, чтобы персональные данные были доступны только уполномоченным сотрудникам. Кроме того, мы обучаем сотрудников вопросам безопасности и конфиденциальности, чтобы они понимали важность защиты персональных данных.\n2. Наши возможности в области защиты данных:\nМы стремимся обеспечить безопасность ваших персональных данных.\nМы применяем контроль доступа, мониторинг, "
TUForm_FirstUseAgreementContent_ImprovementPlan13="шифрование, обезличивание или псевдонимизацию, обучение сотрудников и другие меры, чтобы защитить данные от несанкционированного доступа, использования, раскрытия, изменения, повреждения, утраты и иных видов незаконной обработки.\nМы разработали план обеспечения непрерывности деятельности для бесперебойного оказания услуг. Наши правила и процедуры информационной безопасности строго соответствуют международным стандартам. Они регулярно пересматриваются и обновляются, а эффективность системы управления безопасностью и защитных мер проверяется независимыми аудитами. ZTE Corporation "
TUForm_FirstUseAgreementContent_ImprovementPlan14="и некоторые её дочерние компании сертифицированы по стандарту информационной безопасности ISO 27001 и способны эффективно защищать ваши персональные данные. При утечке данных мы запускаем план экстренного реагирования, принимаем меры, чтобы предотвратить ухудшение ситуации, и своевременно уведомляем вас и соответствующий надзорный орган.\n3. Мы принимаем все разумные и осуществимые меры, чтобы не собирать данные, не относящиеся к целям обработки. Мы храним ваши персональные данные только столько, сколько необходимо для достижения целей этой политики, если более длительное хранение не требуется или не "
TUForm_FirstUseAgreementContent_ImprovementPlan15="разрешено законом.\n4. Интернет не обеспечивает абсолютной безопасности. Большинство сообщений, включая электронную почту и мгновенные сообщения, не шифруется. Мы настоятельно рекомендуем не передавать персональные данные такими способами. Используйте сложный пароль, чтобы помочь нам защитить вашу учётную запись.\n5. Мы регулярно обновляем и публикуем сведения об отчётах по рискам безопасности, оценке влияния на безопасность персональных данных и другим вопросам. Если отчёт об оценке безопасности затрагивает ваши права в отношении персональных данных, мы открыто сообщаем о рисках. "
TUForm_FirstUseAgreementContent_ImprovementPlan16="Подробное содержание отчёта можно получить по адресу:\nЭл. почта: Privacy@zte.com.cn\n6. Интернет не является полностью безопасной средой. Мы приложим все усилия, чтобы обеспечить безопасность любых переданных нам сведений. Если повреждение наших физических, технических или организационных средств защиты приведёт к несанкционированному доступу, публичному раскрытию, изменению или повреждению данных и нарушит ваши законные права и интересы, мы понесём соответствующую юридическую ответственность.\n7. При инциденте с безопасностью персональных данных мы своевременно сообщим вам основные сведения о нём и его "
TUForm_FirstUseAgreementContent_ImprovementPlan17="возможных последствиях, о принятых или планируемых мерах, о том, как самостоятельно предотвратить и уменьшить риски, а также о мерах по устранению последствий для вас. Мы уведомим вас по электронной почте, письмом, по телефону или push-уведомлением. Если уведомить каждого субъекта данных отдельно затруднительно, мы опубликуем извещение разумным и действенным способом.\nКроме того, мы сообщим о ходе урегулирования инцидента в соответствии с требованиями надзорного органа.\nIV. Ваши права\nВ соответствии с законами, нормативными актами и стандартами "
TUForm_FirstUseAgreementContent_ImprovementPlan18="защиты персональных данных, а также общепринятой практикой других стран и регионов мы гарантируем следующие права в отношении ваших данных.\n1. Доступ к персональным данным\nВы имеете право на доступ к своим персональным данным, кроме предусмотренных законом исключений. Для реализации этого права напишите на privacy@zte.com.cn или отправьте запрос через систему обработки запросов субъектов данных pdsr.zte.com.cn. Если это не потребует чрезмерных усилий с нашей стороны, мы также предоставим другие ваши персональные данные, сформированные при использовании наших продуктов или услуг.\n2. Исправление "
TUForm_FirstUseAgreementContent_ImprovementPlan19="персональных данных\nЕсли вы обнаружили ошибку в обрабатываемых нами данных, вы вправе потребовать её исправления. В любое время напишите на privacy@zte.com.cn или отправьте запрос через систему обработки запросов субъектов данных pdsr.zte.com.cn.\n3. Удаление персональных данных\nВы можете потребовать удалить персональные данные, если:\n(1) Мы нарушили законы или нормативные требования.\n(2) Мы не получили вашего согласия.\n(3) Мы нарушили соглашение с вами.\n(4) Вы больше не используете наши продукты или услуги либо ваша "
TUForm_FirstUseAgreementContent_ImprovementPlan20="учётная запись закрыта.\n(5) Мы больше не предоставляем вам продукты или услуги.\nЕсли мы решим удовлетворить запрос на удаление, мы также уведомим получателей ваших данных и потребуем своевременно удалить их, если иное не предусмотрено законом либо эти получатели не получили отдельное разрешение от вас. После удаления данных их копии в резервной системе могут сохраняться некоторое время; мы удалим их при обновлении резервных копий.\n4. Изменение объёма разрешения\nДля работы каждой функции необходимы "
TUForm_FirstUseAgreementContent_ImprovementPlan21="определённые базовые персональные данные (см. первый раздел этой политики). Вы можете в любое время разрешить или запретить сбор и использование дополнительных данных.\nДля этого вы можете самостоятельно выполнить следующие действия:\nОтключите программу в веб-интерфейсе: «Расширенные настройки > Настройки системы > Программа улучшения сервиса». Мы удалим локальные данные.\nЕсли получить доступ к данным указанными способами не удаётся, напишите на privacy@zte.com.cn или отправьте запрос через систему обработки запросов субъектов данных pdsr.zte.com.cn. "
TUForm_FirstUseAgreementContent_ImprovementPlan22="После отзыва согласия мы прекратим обработку соответствующих данных. Однако отзыв не влияет на обработку, ранее выполненную с вашего разрешения.\n5. Получение копии персональных данных\nВы вправе получить копию своих персональных данных. При наличии технической возможности, например совместимых интерфейсов обмена, мы можем передать копию непосредственно указанной вами третьей стороне.\n6. Ограничение автоматического принятия решений\nВ некоторых функциях решения могут приниматься без участия человека, только средствами информационных систем "
TUForm_FirstUseAgreementContent_ImprovementPlan23="и алгоритмов. Если такие решения существенно затрагивают ваши законные права и интересы, вы вправе потребовать разъяснения, а мы предоставим надлежащие способы защиты ваших прав.\n7. Ответы на ваши запросы\nВ целях безопасности вам может потребоваться подать письменный запрос или подтвердить личность другим способом. Мы можем запросить подтверждение личности перед обработкой обращения.\nМы приложим все усилия, чтобы ответить в течение одного месяца со дня получения запроса. С учётом сложности и количества запросов этот срок при необходимости может быть продлён "
TUForm_FirstUseAgreementContent_ImprovementPlan24="ещё на два месяца. При задержке мы уведомим вас об обстоятельствах и причинах продления. Если указанный здесь срок противоречит местным законам и нормативным актам, применяются местные требования.\nКак правило, разумные запросы выполняются бесплатно, однако за повторные обращения сверх разумного предела взимается плата. Мы можем отклонить необоснованно повторяющиеся запросы, обращения, требующие чрезмерных технических усилий (например, разработки новой системы или коренного изменения существующей практики), создающие риск для законных прав и интересов других "
TUForm_FirstUseAgreementContent_ImprovementPlan25="лиц либо практически невыполнимые (например, связанные с данными на резервной магнитной ленте).\nВ соответствии с законами и нормативными актами мы не сможем выполнить ваш запрос, если:\n(1) Он непосредственно связан с национальной безопасностью и обороной.\n(2) Он непосредственно связан с общественной безопасностью, здравоохранением или значимыми общественными интересами.\n(3) Он непосредственно связан с уголовным расследованием, преследованием, судебным разбирательством или исполнением приговора.\n(4) Есть достаточные "
TUForm_FirstUseAgreementContent_ImprovementPlan26="доказательства злого умысла или злоупотребления правами с вашей стороны.\n(5) Выполнение запроса серьёзно нарушит ваши законные права и интересы либо права и интересы других лиц и организаций. (6) Запрос затрагивает коммерческую тайну.\nV. Как мы обрабатываем персональные данные детей\nНаши продукты, сайты и услуги предназначены главным образом для взрослых. Дети не вправе создавать учётные записи без согласия родителей или опекунов.\nЕсли данные ребёнка собраны с согласия родителей, мы используем или раскрываем их только в случаях, разрешённых "
TUForm_FirstUseAgreementContent_ImprovementPlan27="законом, с явного согласия родителей или опекунов либо когда это необходимо для защиты ребёнка.\nХотя местные законы и обычаи по-разному определяют детский возраст, мы считаем ребёнком любого человека младше 16 лет.\nЕсли мы обнаружим, что собрали персональные данные ребёнка без подтверждённого согласия родителей, мы постараемся удалить их как можно скорее.\nVI. Как мы передаём персональные данные за рубеж\nМы предоставляем продукты и услуги с помощью ресурсов и серверов по всему миру. Поэтому ваши данные могут передаваться за пределы страны или "
TUForm_FirstUseAgreementContent_ImprovementPlan28="региона, где вы используете продукт или услугу, либо быть доступны из другой юрисдикции. Любая такая передача допускается только в соответствии с применимым законодательством.\nПри обработке персональных данных мы принимаем меры для соблюдения всех применимых местных законов, включая условия и ограничения на передачу данных. Мы также можем защищать данные другими юридически действительными способами, в том числе международными соглашениями о передаче данных.\nVII. Особые положения GDPR\nСледующие положения применяются только "
TUForm_FirstUseAgreementContent_ImprovementPlan29="к лицам, проживающим в Европе.\n1. Правовые основания обработки персональных данных\nОбработка данных, описанная в разделе «Как мы собираем и используем персональные данные», осуществляется на следующих правовых основаниях:\n1.1. Согласие. Мы можем обрабатывать данные с вашего согласия. В частности, мы можем запросить ваше согласие на участие в рекламных мероприятиях, например на получение рекламных сообщений, участие в программе улучшения пользовательского опыта и использование отдельных услуг, в том числе связанных со сбором данных о местоположении. Вы вправе не давать "
TUForm_FirstUseAgreementContent_ImprovementPlan30="согласие или отозвать его в любое время. Отзыв не влияет на правомерность использования данных до его получения. Если вы дали согласие, мы используем данные только для целей, указанных в заявлении о согласии. Если обработка основана на согласии, а вы не предоставите его или отзовёте, мы можем утратить возможность предоставлять соответствующую услугу. Помимо этого, отказ или отзыв согласия не повлечёт для вас отрицательных последствий.\n1.2. Заключение или исполнение договора с вами.\nМы опираемся на это основание, в частности, чтобы:\n- Предоставлять "
TUForm_FirstUseAgreementContent_ImprovementPlan31="услуги ZTE, обрабатывать заказы и исполнять договор между вами и ZTE.\n- Активировать приобретённые услуги, гарантийное обслуживание и отдельные лицензии на ПО, а также уведомлять об обновлениях ПО.\n- Обеспечивать и организовывать ваше участие в проводимых нами розыгрышах, конкурсах и других подобных рекламных мероприятиях.\n- Выявлять неполадки, ремонтировать оборудование клиентов и оказывать другие услуги обслуживания и поддержки.\n1.3. Исполнение требований закона. ZTE может быть обязана обрабатывать персональные данные "
TUForm_FirstUseAgreementContent_ImprovementPlan32="для исполнения правовых обязанностей, например хранить сведения для исполнения налогового законодательства или в коммерческих целях.\n1.4. Законные интересы. Обработка данных также может быть необходима для законных интересов ZTE. В частности, чтобы:\n- Проводить опросы клиентов для улучшения пользовательского опыта.\n- Анализировать потребительский рынок с учётом страны, в которой вы пользуетесь нашими услугами, включая число пользователей, для маркетинга и продвижения продуктов.\n- Анализировать эффективность нашей деятельности.\n- "
TUForm_FirstUseAgreementContent_ImprovementPlan33="Анализировать журналы ошибок для повышения качества телефонов и улучшения функций приложений.\n- Предоставлять персонализированные услуги, рекомендовать и показывать подходящие вам материалы и рекламу в наших сервисах.\n- Общаться с вами и отвечать на вопросы и замечания, переданные любым способом.\n- Обеспечивать работоспособность и безопасность наших услуг.\n- Проверять вашу личность.\n- Проводить внутренний аудит, предотвращать и расследовать мошенничество, киберугрозы и другие "
TUForm_FirstUseAgreementContent_ImprovementPlan34="злоупотребления.\n- Совершенствовать и развивать услуги, включая функции безопасности, улучшая опыт использования, удобство, производительность, функции и дизайн продуктов.\n- Предъявлять юридические требования или защищаться от них.\nМы обрабатываем данные на этих основаниях только после надлежащей оценки и сопоставления наших интересов с вашим правом на неприкосновенность частной жизни.\n2. Дополнительные сведения о правах в отношении персональных данных\nПри соблюдении предусмотренных GDPR условий вы имеете следующие права.\nПраво "
TUForm_FirstUseAgreementContent_ImprovementPlan35="на доступ. Вы можете запросить доступ к имеющимся у нас данным о вас.\nПраво на исправление. Если обрабатываемые нами данные неточны или неполны, вы вправе потребовать без неоправданной задержки исправить их и при необходимости дополнить.\nПраво на удаление. Вы можете потребовать удалить данные. В определённых обстоятельствах мы обязаны сделать это без неоправданной задержки, например если у нас больше нет законного основания для обработки в объёме, предусмотренном применимыми законами и нормативными актами. Обратите внимание: удаление всех данных с устройства не означает удаления всех сведений "
TUForm_FirstUseAgreementContent_ImprovementPlan36="о вас, которые собирает и обрабатывает ZTE. Поэтому для удаления персональных данных рекомендуем обратиться к нам (см. раздел «Как с нами связаться»).\nПраво на ограничение обработки. В определённых обстоятельствах вы вправе потребовать от ZTE временно ограничить обработку, например на время проверки точности данных, которые вы оспариваете. Мы сохраним лишь необходимый объём данных или будем обрабатывать их только в той мере, которая нужна для соблюдения вашего требования об ограничении в дальнейшем.\nПРАВО НА ВОЗРАЖЕНИЕ. Вы вправе в любое время возразить против "
TUForm_FirstUseAgreementContent_ImprovementPlan37="обработки на основании законных интересов по причинам, связанным с вашей конкретной ситуацией. В этом случае мы прекратим обработку ваших данных, если не докажем наличие веских оснований, преобладающих над вашими интересами, правами и свободами, либо необходимость установления, осуществления или защиты наших юридических требований. Вы можете в любое время и по любой причине возразить против прямого маркетинга.\nПраво на переносимость данных. Вы вправе получить копию своих данных в структурированном, общепринятом и машиночитаемом формате и передать её другому поставщику услуг "
TUForm_FirstUseAgreementContent_ImprovementPlan38="либо, при определённых обстоятельствах, поручить нам такую передачу.\nПраво на отзыв согласия. Если вы дали согласие на обработку, а затем изменили решение, вы вправе отозвать его в любое время. Это не влияет на правомерность использования данных до отзыва. Чтобы отказаться от рекламных сообщений, вы можете отписаться способом, указанным в каждом таком сообщении. После отзыва согласия мы можем утратить возможность предоставлять соответствующую услугу.\nПраво на жалобу. Вы вправе подать жалобу на порядок обработки данных в компетентный надзорный "
TUForm_FirstUseAgreementContent_ImprovementPlan39="орган или обратиться в суд надлежащей юрисдикции. Контактные сведения местных органов защиты данных доступны по адресу https://edpb.europa.eu/about-edpb/board/members_en.\n3. Дополнительные сведения о трансграничной передаче При передаче данных за пределы Европейской экономической зоны мы принимаем меры, чтобы обеспечить надлежащую техническую и организационную защиту и сохранить права на конфиденциальность, предусмотренные этой политикой. Мы внедрили стандартные договорные положения Европейской комиссии "
TUForm_FirstUseAgreementContent_ImprovementPlan40="как средство обеспечения надлежащей защиты данных, которые обрабатываем по всему миру. При любой передаче персональных данных мы обеспечиваем гарантии, предусмотренные нормативными требованиями.\nVIII. Уведомление для потребителей Калифорнии\nПотребители Калифорнии имеют перечисленные ниже права на конфиденциальность. Права, предоставляемые законом Калифорнии о защите конфиденциальности потребителей и законом Shine the Light, различаются. Для реализации прав следуйте приведённым ниже указаниям, относящимся к соответствующему закону.\nЗакон Калифорнии "
TUForm_FirstUseAgreementContent_ImprovementPlan41="о защите конфиденциальности потребителей (CCPA)\nCCPA предусматривает отдельные исключения для данных, которые мы собираем при предоставлении продуктов или услуг другим компаниям. Он также не применяется к сведениям, полученным в связи со статусом соискателя, сотрудника или подрядчика ZTE. В отношении данных, собранных в этих обстоятельствах или об указанных лицах, вам могут не предоставляться некоторые или все перечисленные ниже права.\nСбор, использование и раскрытие данных за последние 12 месяцев\nCCPA обязывает "
TUForm_FirstUseAgreementContent_ImprovementPlan42="нас раскрывать определённые общие сведения о сборе, использовании и раскрытии данных за последние 12 месяцев. За этот период:\nМы собирали категории данных, указанные выше в разделе о сборе и использовании персональных данных.\nМы не продавали персональные данные в том смысле, в котором термин «продажа» используется в CCPA и подзаконных актах.\nМы не раскрывали персональные данные никаким получателям.\nВы вправе запросить более подробные сведения о ваших данных, как описано ниже в пункте «Запрос "
TUForm_FirstUseAgreementContent_ImprovementPlan43="сведений».\nПрава на конфиденциальность в Калифорнии\nСогласно CCPA вы имеете следующие права.\nЗапрос сведений. Вы вправе узнать о нашей деятельности за последние 12 месяцев: (i) конкретные сведения о вас, которые мы собрали; (ii) категории собранных данных; (iii) категории источников этих данных; (iv) категории третьих сторон, которым мы предоставляем данные; (v) категории проданных или раскрытых данных о вас и для каждой категории - категории третьих сторон, которым мы продали или раскрыли эти данные; (vi) наши деловые или коммерческие цели сбора или продажи ваших персональных "
TUForm_FirstUseAgreementContent_ImprovementPlan44="данных.\nВы можете бесплатно подавать такие запросы дважды в год. Если мы не можем выполнить запрос, мы сообщим причину. При ответе запрещено раскрывать ваш номер социального страхования, водительского удостоверения или другого государственного документа, номер финансового счёта, медицинской страховки или медицинского идентификатора, пароль учётной записи, контрольные вопросы и ответы, а также уникальные биометрические данные, полученные измерением или техническим анализом характеристик человека.\nЗапрос на удаление. Вы вправе потребовать "
TUForm_FirstUseAgreementContent_ImprovementPlan45="удалить собранные у вас персональные данные. В некоторых обстоятельствах мы можем отказать, например для исполнения требований закона или завершения операции, для которой были собраны данные. В случае отказа мы сообщим причину.\nПраво на отказ от продажи данных. Вы вправе отказаться от продажи своих персональных данных. Хотя мы никогда не обмениваем их на деньги или иное вознаграждение, определение «продажи» в CCPA очень широкое и может включать использование сервисов показа рекламы с учётом ваших интересов. Мы не продаём данные без согласия родителя или опекуна, "
TUForm_FirstUseAgreementContent_ImprovementPlan46="если нам известно, что они относятся к ребёнку младше 13 лет. Если нам известно, что данные относятся к несовершеннолетнему от 13 до 16 лет, мы не продаём их без его согласия. Если вы совершеннолетний и не заявили об отказе, ваши данные могут продаваться в порядке, описанном в этой политике.\nПраво на отсутствие дискриминации. Реализация любого из этих прав не станет основанием для дискриминации. Однако при реализации отдельных прав некоторые функции приложения могут стать недоступны.\nЧтобы запросить сведения или удаление данных, позвоните по номеру "
TUForm_FirstUseAgreementContent_ImprovementPlan47="001-877-817-1759 или напишите на privacy@zte.com.cn. Если вы уполномоченный представитель жителя Калифорнии, используйте номер 001-877-817-1759 или адрес privacy@zte.com.cn.\nДля отказа от продажи данных позвоните по номеру 001-877-817-1759 или напишите на privacy@zte.com.cn. Если вы уполномоченный представитель жителя Калифорнии, используйте номер 001-877-817-1759 или адрес privacy@zte.com.cn.\nПрежде чем обработать запрос сведений или запрос на удаление, мы примем меры для проверки вашей личности. Мы не выполним запрос, пока "
TUForm_FirstUseAgreementContent_ImprovementPlan48="не получим достаточно сведений, чтобы обоснованно убедиться, что вы и есть человек, чьи данные были собраны. Если у вас есть учётная запись, мы используем действующие способы её аутентификации. Если учётной записи нет, мы можем запросить дополнительные сведения для подтверждения личности. Мы используем предоставленные сведения только для проверки личности и обработки запроса, если изначально вы не передали их для другой цели.\nВы можете поручить уполномоченному представителю подать запрос сведений или запрос на "
TUForm_FirstUseAgreementContent_ImprovementPlan49="удаление. При проверке такого обращения мы можем проверить личности и вашу, и представителя, а также запросить подписанный вами документ о его полномочиях. Для защиты ваших данных мы вправе отклонить обращение представителя, не подтвердившего право действовать от вашего имени.\nShine the Light\nПотребители Калифорнии также могут раз в календарный год запрашивать сведения о персональных данных, предоставленных третьим сторонам для их собственного прямого маркетинга, включая категории данных, названия и "
TUForm_FirstUseAgreementContent_ImprovementPlan50="адреса компаний-получателей. Для этого напишите на privacy@zte.com.cn или позвоните по номеру 001-877-817-1759. В теме электронного письма или первой строке обычного письма укажите «Shine the Light Request», а также сообщите имя, улицу и номер дома, город, штат и почтовый индекс.\nIX. Как обновляется эта политика\nНаша политика может изменяться.\nБез вашего явного согласия мы не будем сокращать предусмотренные ею права.\nВсе изменения будут опубликованы на этой странице. О существенных изменениях мы дополнительно сообщим более заметными уведомлениями, в том "
TUForm_FirstUseAgreementContent_ImprovementPlan51="числе для отдельных услуг - электронным письмом с описанием конкретных изменений.\nК существенным изменениям относятся, в частности:\n1. Значительное изменение модели предоставления услуг, например целей обработки, видов данных или способов их использования.\n2. Существенные изменения структуры собственности или организации, например смена владельцев при реорганизации деятельности, банкротстве, слиянии или поглощении.\n3. Изменение основных получателей данных при их предоставлении, передаче или публичном раскрытии.\n4. Существенное изменение "
TUForm_FirstUseAgreementContent_ImprovementPlan52="ваших прав на участие в обработке данных или способов реализации этих прав.\n5. Изменение подразделения, отвечающего за безопасность персональных данных, контактных данных или канала подачи жалоб.\n6. Выявление высокого риска в отчёте об оценке влияния на безопасность персональных данных.\nМы также сохраним прежнюю версию политики в архиве для вашего ознакомления.\nX. Как с нами связаться\nМы создали специальное подразделение по защите персональных данных - Data Protection Compliance "
TUForm_FirstUseAgreementContent_ImprovementPlan53="Dept. Если у вас есть вопросы, замечания или предложения по этой политике, напишите на Privacy @zte.com.cn. Мы ответим в надлежащий срок.\nВы также можете направить письмо в подразделение по соблюдению требований защиты данных в штаб-квартире ZTE.\nПолучатель: Data Protection Compliance Dept. of ZTE Corporation\nАдрес: 26/F, R&D Building, No. 55, Hi-Tech Road South, Shenzhen, China (Post Code: 518057)\nЕсли вы недовольны нашим ответом, особенно если обработка данных нарушила ваши законные права и интересы, вы можете "
TUForm_FirstUseAgreementContent_ImprovementPlan54="обратиться в местный орган защиты данных.\nКонтактные сведения надзорных органов других регионов можно получить у местных властей. Контакты органов защиты данных Европейского союза доступны по адресу: https://ec.europa.eu/justice/article-29/structure/data-protection-authorities/index_en.htm"


