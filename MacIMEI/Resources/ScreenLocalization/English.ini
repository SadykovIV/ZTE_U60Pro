TUForm_FirstUseAgreementContent_PrivacyStatement1="This policy applies only to ZTE Corporation smart router products.\n\nThis Privacy Policy is available in other languages. If there is any inconsistency, the English version shall prevail.\n\nIf you have any questions, comments, or suggestions, please contact us through the following means:\n\nE-mail: privacy@zte.com.cn\n\nCompany Name: ZTE Corporation\n\nRegistered Address: ZTE Building, No. 55, Hi-Tech Road South, Nanshan District, Shenzhen, P.R. China"
TUForm_FirstUseAgreementContent_PrivacyStatement2="ZTE understands the importance of personal information to you, and will make every effort to ensure the security and reliability of your personal information. We are committed to maintaining your trust in us and abiding by the following principles to protect your personal information: consistency of authority and responsibility, clear purpose, selection of consent, minimum sufficiency, security, subject participation, openness and transparency. Meanwhile, ZTE promises to take appropriate security measures to protect your personal information in accordance with well-established security standards in the industry."
TUForm_FirstUseAgreementContent_PrivacyStatement3="Please read and understand this Privacy Policy carefully before using our products or services.\nThis policy helps you understand the following:\n1.How we collect and use your personal information\n2.How we share, transfer, and disclose your personal information\n3.How we protect your personal information\n4.Your rights\n5.How we process the personal information of children\n6.How to transfer your personal information around the world\n7.GDPR-Specific Provisions\n8.Notice to California Consumers\n9.How to update this policy"
TUForm_FirstUseAgreementContent_PrivacyStatement4="10.Contact us\nⅠ. How we collect and use your personal information\nPersonal information refers to the information that is recorded electronically or in other ways and that can be used independently or in conjunction with other information to identify a specific natural person or reflect the activities of a specific natural person. ZTE will collect and use your personal information only for the following purposes described in this policy:\nBusiness function : Version update\nTo update your system in the timely manner and to make sure your routers work properly, the following information needs to be collected:"
TUForm_FirstUseAgreementContent_PrivacyStatement5="IMEI, SN and software version of router device.\nThe data mentioned above will be stored in the FOTA servers that are deployed by ZTE. Because ZTE provides service all over the world, ZTE deploys FOTA servers globally. For example, EU’s servers are deployed in Frankfort, Germany, the personal information we collect and generate in the People's Republic of China will be stored within the territory of the People's Republic of China.\nWe will use your personal information in the following ways: in accordance with the router device information you provided, we will check for the right version for your device, with your authorization or certain"
TUForm_FirstUseAgreementContent_PrivacyStatement6="conditions are met, we will download and update new version in order to resolve possible risk in the system. Meanwhile, we provide auto-update feature in order to resolve critical failures your device might have and to update security patch. This feature is enabled by default. To disable this feature, please go to advanced Settings > upgrade on our web-based management page to set it. Besides, updating version will consume mobile data.\nIf you do not provide the information, you will not be able to check for the latest version of software, perform update or fix security issues in current system.\nIf we want to use the information for"
TUForm_FirstUseAgreementContent_PrivacyStatement7="other purposes not specified in this policy, we will seek your approval in advance. If we want to use the information collected for specific purposes for other purposes, we will seek your approval in advance.\nⅡ. How we share, transfer and disclose your personal information\nTo ensure the security of your personal information, we shall follow the minimization principle and share, transfer, or disclose your personal information in accordance with applicable laws and requirements.\nFor the companies, organizations, and individuals that share personal information with us, we will take organizational and technical measures in accordance with the local laws and"
TUForm_FirstUseAgreementContent_PrivacyStatement8="regulations, and require them to process personal information in accordance with our security standards, this policy, and related confidentiality and security measures.\n1.Sharing\nWe will not share your personal information with any company, organization, or individuals other than ZTE Corporation and its subsidiaries, except in the following cases:\n(1) After obtaining your explicit consent, we will share your personal information with other parties.\n(2) We may share your personal information in accordance with laws and regulations or mandatory requirements of government authorities."
TUForm_FirstUseAgreementContent_PrivacyStatement9="\n1.Transfer\nWe will not transfer your personal information to any company, organization or individual except in the following cases:\n(1) Transfer with express consent: After obtaining your express consent, we will transfer your personal information to other parties.\n(2) If personal information transfer is involved in a merger, acquisition, or bankruptcy liquidation, we will require new companies or organizations that hold your personal information to continue to be subject to this privacy policy. Otherwise, we will require the companies or organizations to re-request authorization from you."
TUForm_FirstUseAgreementContent_PrivacyStatement10="\nPublic Disclosure\nWe will disclose your personal information only in the following cases:\n(1) With your express consent.\n(2) Disclosure based on law: We may disclose your personal information in case of law, legal procedure, litigation, or mandatory requirements of government authorities.\nⅢ. How we protect your personal information\n1. We have taken the security protection measures that comply with industry standards to protect the personal information provided by you against unauthorized access, public disclosure, use, modification, damage or loss. We will take all reasonable and"
TUForm_FirstUseAgreementContent_PrivacyStatement11="feasible measures to protect your personal information.\nWe provide the safe browsing mode of https for services. We use encryption technologies to ensure data confidentiality. We use trusted protection mechanisms to prevent data from being maliciously attacked. We will deploy access control mechanisms to ensure that only authorized personnel can access personal information. In addition, we will hold the training course on security and privacy protection to enhance employees' awareness of the importance of personal information protection.\nOur data security capabilities:\nWe have been committed to"
TUForm_FirstUseAgreementContent_PrivacyStatement12="protecting your personal information security.\nWe have taken various security measures, such as access control system, monitoring system, encryption, anonymization or pseudonymisation, employee training and so forth, to protect your personal information from unauthorized access, use, disclosure, modification, damage or loss and other forms of illegal processing.\nWe have developed a business continuity plan to ensure that services can be provided continuously. Our information security policies and procedures are designed in strict accordance with international standards, and reviewed and updated"
TUForm_FirstUseAgreementContent_PrivacyStatement13="regularly, and the effectiveness of the security management architecture and measures is ensured through regular third party security audits. ZTE Corporation and some of its subsidiaries have passed the ISO 27001 information security certification, and can effectively protect your personal information. In case of personal information leakage, we will initiate an emergency plan, take effective measures to prevent the situation from getting worse, and notify the relevant supervisory authority and you in a timely manner.\nWe will take all reasonable and feasible measures to ensure that irrelevant personal information is not collected. We will retain your personal"
TUForm_FirstUseAgreementContent_PrivacyStatement14="information only for the period required to achieve the objectives specified in this policy, unless the retention period needs to be extended or is permitted by law.\nThe Internet is not absolutely secure, and most communications, such as emails and instant messaging, are not encrypted. We strongly recommend that you do not send personal information through such means. Please use a complicated password to help us ensure the security of your account.\nWe shall regularly update and publicize the contents related to reporting such as security risks , personal information security impact assessments and so forth . If we affect your personal"
TUForm_FirstUseAgreementContent_PrivacyStatement15="information rights in security assessment reports, we will actively disclose security risks. You can obtain detailed report contents in the following way:\nE-mail: privacy@zte.com.cn\nThe Internet environment is not 100 percent secure. We will do our best to ensure or guarantee the security of any information you send us. If our physical, technical or management protection facilities are damaged, which results in unauthorized access, public disclosure, tampering or damage that affects your legal rights and interests, we shall assume the corresponding legal responsibilities.\nWhen personal information security incident occurs, we will inform you of"
TUForm_FirstUseAgreementContent_PrivacyStatement16="the basic situation and possible impact of the security incident in a timely manner, the measures we have taken or will take, suggestions for voluntarily preventing and reducing risks, and remedial measures for you. We will inform you of the incident by email, letter, telephone or pushing notification in a timely manner. If it is difficult to inform the subjects of personal information one by one, we will release the notice in a reasonable and effective manner.\nIn addition, we will actively report the handling of personal information security incidents in accordance with the requirements of the regulatory department."
TUForm_FirstUseAgreementContent_PrivacyStatement17="Ⅳ. Your rights\nIn accordance with personal information protection laws, regulations, standards, and common practices in other countries and regions, we guarantee that you have the following rights over your personal information:\nAccess to your personal information\nYou have the right to access your personal information, except for exceptions as required by laws and regulations. If you want to exercise data access rights, you can access the data by yourself in the following ways:\nYou can send an e-mail to privacy@zte.com.cn. We will respond to your access request within 15 working days.\nIf you cannot access this personal"
TUForm_FirstUseAgreementContent_PrivacyStatement18="information through the method, you can submit the request by login the data subject right response system: pdsr.zte.com.cn. As long as we do not need to make too many efforts, we will provide you with other personal information generated when you use our products or services.\nCorrect your personal information\nWhen you find that your personal information processed by us is incorrect, you have the right to request us to correct it. You can apply for a correction through the method listed in "(1) Access to your personal information". If you cannot correct this personal information through the above method you can submit the request by login the data subject right"
TUForm_FirstUseAgreementContent_PrivacyStatement19="response system: pdsr.zte.com.cn at any time.\nDelete your personal information\nYou can submit a request for deleting personal information in the following cases:\n(1) we violated laws and regulations.\n(2) we did not obtain your consent.\n(3) we violated an agreement with you.\n(4) you will not use our products or services any longer, or your account is canceled.\n(5) we do not provide products or services for you.\nIf we decide to respond to your deletion request, we will also notify the entities that obtain your personal information from us and require them"
TUForm_FirstUseAgreementContent_PrivacyStatement20="to delete your personal information in a timely manner, unless required by other laws and regulations, or these entities obtain your independent authorization. After you delete information, we may not immediately delete the corresponding information in the backup system, but we will delete the information during the backup update.\nPersonal information subjects obtain copies of personal information\nYou have the right to obtain a copy of your personal information. You can perform the following operations by yourself:\nYou can apply for a copy of your personal information through the method listed in "(1) Access to your"
TUForm_FirstUseAgreementContent_PrivacyStatement21="personal information". If you cannot obtain the copy through the above method you can submit the request by login the data subject right response system: pdsr.zte.com.cn at any time.\nUnder the prerequisite that the technology is feasible, for example, data interface matching, we can transmit the copy of your personal information directly to the third party specified by you.\nRestrain Automatic decision-making of the information system\nIn some business functions, we may make decisions only based on non-manual automatic decision-making mechanisms such as information systems and algorithms. If these decisions have a significant impact on"
TUForm_FirstUseAgreementContent_PrivacyStatement22="your legal rights and interests, you have the right to ask us for an explanation, and we will provide appropriate relief methods.\nRespond to your above requests\nTo ensure security, you may need to provide a written request or prove your identity in other ways. We may ask you to verify your identity before processing your request.\nWe will make every effort to ensure that a response is made within one month since we received your request. Considering the complexity and quantity of the request, this period may be extended by another two months if necessary. In the case of postponed respond, we will notify you of the relevant circumstances and the"
TUForm_FirstUseAgreementContent_PrivacyStatement23="reason for the delay. If the time limit set in this paragraph conflicts with local laws and regulations, the local laws and regulations shall prevail.\nIn principle, we do not charge for your reasonable requests, but we will charge for repeated requests that exceed a reasonable limit. We may reject requests that repeat unreasonably, require excessive technical means (for example, development of a new system or a fundamental change of current practice), and bring risks to other people's legitimate rights and interests or that are extremely impractical (for example, involving information stored on the backup tape)."
TUForm_FirstUseAgreementContent_PrivacyStatement24="We will not be able to respond to your request in accordance with laws and regulations if:\n(1) The case is directly related to national security and national defense security.\n(2) The case is directly related to public safety, public health, and major public interests.\n(3) The case is directly related to any criminal investigation, prosecution, trial, and execution of a judgment .\n(4) There is sufficient evidence that you have subjective malice or abuse of rights.\n(5) Responding to your request will cause serious damage to the legal rights and interests of yours or other individuals' and organizations'."
TUForm_FirstUseAgreementContent_PrivacyStatement25="(6) Business secrets are involved.\nⅤ. How we process the personal information of children\nOur products, websites, and services are mainly for adults. Without the consent of parents or guardians, children are not allowed to create their own user accounts.\nIf the personal information of children is collected with the consent of their parents, we will only use or disclose this information with the permit of law,the express consent of parents or guardians or the necessary protection of children.\nAlthough local laws and customs define children differently, we regard anyone under 16 as a child.\nIf we find that we have collected"
TUForm_FirstUseAgreementContent_PrivacyStatement26="personal information of children without obtaining confirmed parental consent, we will try to delete the information as soon as possible.\nⅥ. How to transfer your personal information around the world\nBecause we provide products or services through resources and servers around the world, as a result, your personal information may be transferred to an overseas jurisdiction of the country or area in which the products or services used by you are, or may be accessed from these jurisdictions. Any such transfer of personal information shall take place only in accordance with applicable law.\nWe will take steps designed to comply with all applicable local laws when"
TUForm_FirstUseAgreementContent_PrivacyStatement27="Processing personal information, including any local law conditions and restrictions on the transfer of personal information. We may also protect your data through other legally valid methods, including international data transfer agreements.\nⅦ. GDPR-Specific Provisions\nThe following provisions only apply to you if you live in Europe.\n1.Legal Bases for the Processing of Personal Data\nOur processing of your personal data as described in the Section "How We Collect and Use Your Personal Data" is based on the following legal grounds:\n1.1 Consent: We may process your personal data with your consent. In particular, we may ask for your"
TUForm_FirstUseAgreementContent_PrivacyStatement28="consent to participate in promotional activities, such as to send you promotional messages or enable you to participate in the User Experience Program and certain Services, including services through which we collect location information. You have the right not to provide consent, or to withdraw it at any time. The withdrawal of your consent does not affect the lawfulness of our use of your personal data before your withdrawal. If you have granted us consent to use your personal data, we will use it only for the purposes specified in the consent declaration. Please note that to the extent our processing is based on your consent and you deny your consent or"
TUForm_FirstUseAgreementContent_PrivacyStatement29="withdraw it, we may not be able to provide the service relating thereto. Besides from that, neither the initial denial nor a withdrawal will have any negative consequences for you.\n1.2 Perform or enter into a contract with you:\nWe rely on this legal basis in particular in the following cases:\n• to provide you with ZTE's Services, process your orders or fulfil the contract between you and ZTE\n• to activate Services you have purchased, your warranty service and specific software licenses and provide notifications for software updates\n• to allow and manage your participation in prize draws, contests or similar promotional activities held"
TUForm_FirstUseAgreementContent_PrivacyStatement30="by us, and\n• to diagnose product issues, repair customer equipment and provide other customer care and support Services.\n1.3 Compliance with a legal obligation: ZTE may be obliged to process personal data to comply with our legal obligations, for example where ZTE is required to retain data for tax law or commercial purposes.\n1.4 Legitimate interests: The processing of your personal data may also be necessary for ZTE's legitimate interests. In particular, such cases may include the following:\n• to conduct customer surveys to enhance your user experience\n• to analyse the customer market on"
TUForm_FirstUseAgreementContent_PrivacyStatement31="the basis of the country where you use our Services, including the number of users for product marketing and promotion\n• to analyse the efficiency of our business operations\n• to analyse error logs to improve phone quality and app functions\n• to provide you with personalized Services and to recommend and display content and advertisements tailored to you through our Services\n• to communicate with you and reply to your questions or comments submitted to us by any means\n• to ensure the functionality and safety of our Services\n• to verify your identity\n• to conduct internal auditing and to"
TUForm_FirstUseAgreementContent_PrivacyStatement32="prevent and investigate fraud, cyber security threats or other improper use\n• to enhance and develop our Services, including relevant security features, so as to improve the product usage experience, user-friendliness, operational performance, functions and design\n• to pursue or defend against legal claims.\nYour personal data will only be processed on the above grounds after we have appropriately assessed and balanced our interests against your right to privacy.\n2.Additional Information on Your Rights Regarding Personal Data\nSubject to the legal requirements under the GDPR, you have the"
TUForm_FirstUseAgreementContent_PrivacyStatement33="following rights:\nThe right to access: You may request access to the personal data we hold about you.\nThe right to rectification: If you find that the personal data we process about you is inaccurate or incomplete, you are entitled to ask us to make rectifications without undue delay and to request the completion of your personal data where appropriate.\nThe right to erasure: You can submit a request to us to delete personal data, and we shall have the obligation to erase it without undue delay in some circumstances – for example, if we do not have a legal reason to continue to process the personal data to the extent required by applicable laws and"
TUForm_FirstUseAgreementContent_PrivacyStatement34="regulations. Please note in so far as you delete all the data that is contained in your device, this does not mean that you have deleted all data that ZTE collects and processes about you. Therefore, we encourage you to contact us (please refer to the section "Contact Us" ) to request that your personal data is deleted.\nThe right to restriction of processing: You have the right, in certain circumstances, to request ZTE to temporarily restrict the processing of your personal data, such as where the accuracy of that personal data is contested by you, while we verify the accuracy of that personal data. We will keep just enough data, or process such data as is necessary to ensure"
TUForm_FirstUseAgreementContent_PrivacyStatement35="that we comply with your restriction request in the future.\nTHE RIGHT TO OBJECT: You have the right to object to any processing justified by legitimate interests based on grounds relating to your particular situation at any time. Should you decide to object to the processing of your personal data, we will stop processing personal data that concerns you, unless we can demonstrate compelling reasons for continuing to process your personal data that override your interests, rights and freedoms, or in the case that we establish, exercise or defend our legal claims. You can object to direct marketing activities at any time for any reason whatsoever."
TUForm_FirstUseAgreementContent_PrivacyStatement36="The right to data portability: You have the right to obtain a copy of your personal data in a structured, commonly-used and machine-readable format and transmit such data to another provider or have such data transmitted to another provider under certain circumstances.\nThe right to withdraw consent: If you have given us your consent to process your personal data but change your mind later, you have the right to withdraw your consent at any time. The withdrawal of your consent does not affect the lawfulness of our use of your personal data before your withdrawal. If you want to withdraw your consent with regard to receiving promotional communications, you can"
TUForm_FirstUseAgreementContent_PrivacyStatement37="unsubscribe through the method described in each promotional message. If you withdraw your consent, we may no longer be able to provide you with the corresponding Service.\nThe right to lodge a complaint: You have the right to lodge a complaint with a competent supervisory authority about the way we handle or process your personal data, or file a lawsuit in a court with jurisdiction. Information about how to contact your local data protection supervisory authority is available here at https://edpb.europa.eu/about-edpb/board/members_en.\n3.Additional Information on Cross-border transfer"
TUForm_FirstUseAgreementContent_PrivacyStatement38="We takes steps to ensure that appropriate technical and organizational security measures and safeguards are applied when transferring personal information outside of the EEA and that privacy rights outlined in this Policy are preserved. We has established Standard Contractual Clauses of the EU Commission as providing an adequate level of protection to the personal information we Process globally. We ensures that all transfers of Personal Information are subject to appropriate safeguards as defined by the regulation.\nⅧ. Notice to California Consumers\nCalifornia consumers have the privacy rights listed below. The rights listed"
TUForm_FirstUseAgreementContent_PrivacyStatement39="below under the California Consumer Privacy Act and Shine the Light are not the same. To exercise your rights, you will need to follow the directions below that are specific to each law.\nCalifornia Consumer Privacy Act (“CCPA”)\nPlease note that the CCPA provides certain exceptions with respect to the Personal Information that we collect in connection with providing products or services to other businesses. Similarly, it does not apply to information we collect in the context of a person’s role as a job applicant, employee or contractor of ZTE. With respect to the Personal Information collected in connection with the above individuals or circumstances, you may"
TUForm_FirstUseAgreementContent_PrivacyStatement40=" not have any or all of the privacy rights listed below. \nCollection, Use and Disclosure of Personal Information in the Past 12 Months\nThe CCPA requires that we make certain disclosures about our general collection, use and disclosure of Personal Information over the past 12 months. Accordingly, in the past 12 months:\nwe collected the categories of Personal Information detailed in the policy of how do we collect and use your personal information above.\n[we did not sell Personal Information, as we understand the term “sale” in the CCPA and its implementing regulations][we sold to the entities"
TUForm_FirstUseAgreementContent_PrivacyStatement41="described in the policy of how do we share, transfer, and disclose your personal information, the following categories of Personal Information: [●]].\n[we did not disclosed Personal Information to any entities.][we disclosed to the entities described in the policy of how do we share, transfer, and disclose your personal information, the following categories of Personal Information: [●]].\nYou have the right to request to know more specific disclosures about your personal information as detailed under “Request to Know” below.\nCalifornia Privacy Rights\nYou have the following privacy rights under the CCPA:"
TUForm_FirstUseAgreementContent_PrivacyStatement42="Request to know. You have the right to request to know the following information about our practices over the past 12 months: (i) the specific pieces of Personal Information we have collected about you,(ii) the categories of Personal Information we have collected about you,(iii) the categories of sources from which we collected Personal Information about you,(iv) the categories of third parties with which we share Personal Information,(v) the categories of your Personal Information that we sold or disclosed and for each category, the categories of third parties to which we sold or disclosed that particular category of Personal Information and, (vi) our business or commercial"
TUForm_FirstUseAgreementContent_PrivacyStatement43="purpose for collecting or selling your Personal Information.\nYou may exercise your right to request to know twice a year, free of charge. If we are unable to fulfill your request to know, we will let you know the reason why. Please note, in response to a request to know, we are prohibited from disclosing your Social Security number, driver’s license number or other government-issued identification number, financial account number, any health insurance or medical identification number, an account password, security questions or answers, unique biometric data generated from measurements or technical analysis of human characteristics."
TUForm_FirstUseAgreementContent_PrivacyStatement44="Request to delete. You have the right to request that we delete the Personal Information that we have collected from you. We may deny your request under certain circumstances, such as if we need to comply with our legal obligations or complete a transaction for which your Personal Information was collected. If we deny your request to delete, we will let you know the reason why.\nRight to opt-out of the sale of your Personal Information. You have the right to opt out of the sale of your Personal Information. While we never exchange personal information for money or other consideration, the CCPA’s definition of “sale” is very broad and may include the use of"
TUForm_FirstUseAgreementContent_PrivacyStatement45="services to deliver interest-based ads to you. We do not knowingly sell the Personal Information of minors under 13 years old without consent from the minor’s parent or guardian. We do not knowingly sell the Personal Information of minors between 13 and 16 years old without the minor’s own consent. If you do not affirmatively opt out, and you are not a minor, your Personal Information may be sold as disclosed in this privacy policy.\nRight to non-discrimination. If you choose to exercise any of these rights, we will not discriminate against you in any way. If you exercise certain rights, understand that you may be unable to use or access certain features of the app."
TUForm_FirstUseAgreementContent_PrivacyStatement46="To make a request to know or a request to delete, contact us at 001-877-817-1759 or send an e-mail to privacy@zte.com.cn. If you are an authorized agent making a request on behalf of a California resident, contact us at 001-877-817-1759 or send an e-mail to privacy@zte.com.cn.\nTo opt-out of the sale of your Personal Information, contact us at 001-877-817-1759 or send an e-mail to privacy@zte.com.cn. If you are an authorized agent making a request on behalf of a California resident, contact us at 001-877-817-1759 or send an e-mail to privacy@zte.com.cn.\nWe will take steps to verify your identity before processing your request to know or request to delete."
TUForm_FirstUseAgreementContent_PrivacyStatement47="We will not fulfill your request unless you have provided sufficient information for us to reasonably verify you are the individual about whom we collected Personal Information. If you have an account with us, we will use our existing account authentication practices to verify your identity. If you do not have an account with us, we may request additional information about you so that we can verify your identity. We will only use the Personal Information you provide to verify your identity and to process your request, unless you initially provided the information for another purpose.\nYou may use an authorized agent to submit a request to know or a request"
TUForm_FirstUseAgreementContent_PrivacyStatement48="to delete. When we verify your agent’s request, we may verify both your and your agent’s identity and request a signed document from you that authorizes your agent to make the request on your behalf. To protect your Personal Information, we reserve the right to deny a request from an agent that does not submit proof that they have been authorized by you to act on your behalf.\nShine the Light\nCalifornia consumers may also request information from us once per calendar year about any Personal Information shared with third parties for the third party’s own direct marketing purposes, including the categories of information and the names and"
TUForm_FirstUseAgreementContent_PrivacyStatement49="addresses of those businesses with which we have shared such information. To request this information, please send an e-mail to privacy@zte.com.cn or contact us at 001-877-817-1759. Your inquiry must specify “Shine the Light Request” in the subject line of the email or the first line of the letter, and include your name, street address, city, state and ZIP code.\nⅨ. How to update this policy\nOur privacy policy may change.\nWithout your express consent, we will not reduce your rights under this privacy policy.\nWe will release any changes to this policy on this page. For major changes, we will also provide more noticeable"
TUForm_FirstUseAgreementContent_PrivacyStatement50="notifications (including notifications for some services, which will be sent via email to describe the specific changes in the privacy policy).\nMajor changes mentioned in this policy include but are not limited to the following situations:\nOur service model has significantly changed. For example, the purpose of processing personal information, the type of processed personal information, and the mode of using the personal information.\nMajor changes have taken place in the ownership structure and organizational structure. Such as changes in owners caused by business adjustment or bankruptcy or mergers and acquisitions."
TUForm_FirstUseAgreementContent_PrivacyStatement51="The major objects of personal information sharing, transfer, or public disclosure are changed.\nYour right to participate in the processing of personal information and the way you exercise it have changed significantly.\nOur responsible department for personal information security, contact method, or complaint channel have changed.\nThe personal information security impact assessment report indicates a high risk.\nWe will also archive the old version of this policy for your reference.\nⅩ. Contact us\nWe have established a special personal information protection"
TUForm_FirstUseAgreementContent_PrivacyStatement52="department – Data Protection Compliance Dept.. If you have any questions, comments, or suggestions on this privacy policy, please feel free to send an email to us at privacy@zte.com.cn, which will be replied within at the appropriate time.\nIn addition, you can send letters to the Data Protection Compliance Dept. of ZTE headquarters.\nTo: Data Protection Compliance Dept. of ZTE Corporation\nAddress: 26/F, R&D Building, No. 55, Hi-Tech Road South, Shenzhen, China (Post Code: 518057)\nIf you are unsatisfied with our response, especially when our personal information processing activities have damaged your legal"
TUForm_FirstUseAgreementContent_PrivacyStatement53="rights and interests, you can seek solutions through the local data protection agency.\nFor contact information about personal information supervisory authority in other areas, you can consult the local government. For the contact information of the European Union data protection agency, please refer to: https://ec.europa.eu/justice/article-29/structure/data-protection-authorities/index_en.htm"


TUForm_FirstUseAgreementContent_ImprovementPlan1="This policy applies only to ZTE Corporation's smart router products (and all third-party applications or services accessed by them). If a third-party application or service has a separate privacy policy, the privacy policy of the application or service is applied preferentially. For the contents that are not covered by the application or service privacy policy, refer to this privacy policy.\nThis Privacy Policy is available in other languages. If there is any inconsistency, the English version shall prevail.\nIf you have any questions, comments, or suggestions, please contact us through the following means:\nE-mail: privacy@zte.com.cn"
TUForm_FirstUseAgreementContent_ImprovementPlan2="Company Name: ZTE Corporation\nRegistered Address: ZTE Building, No. 55, Hi-Tech Road South, Nanshan District, Shenzhen, P.R. China\nZTE understands the importance of personal information to you, and will make every effort to ensure the security and reliability of your personal information. We are committed to maintaining your trust in us and abiding by the following principles to protect your personal information: consistency of authority and responsibility, clear purpose, selection of consent, minimum sufficiency, security, subject participation,  openness and transparency. Meanwhile, ZTE promises to take appropriate security measures to"
TUForm_FirstUseAgreementContent_ImprovementPlan3="protect your personal information in accordance with well-established security standards in the industry.\nPlease read and understand this Privacy Policy carefully before using our products or services.\nThis policy helps you understand the following:\nI. How we collect and use your personal information\nII. How we share, transfer, and disclose your personal information\nIII. How we protect your personal information\nIV. Your rights\nV. How we process the personal information of children\nVI. How to transfer your personal information around the world"
TUForm_FirstUseAgreementContent_ImprovementPlan4="VII. GDPR-Specific Provisions\nVIII. Notice to California Consumers\nIX. How to update this policy\nX. Contact us\nI. How we collect and use your personal information\nPersonal information refers to the information that is recorded electronically or in other ways and that can be used independently or in conjunction with other information to identify a specific natural person or reflect the activities of a specific natural person. ZTE will collect and use your personal information only for the following purposes described in this policy:\nIn order to better locate the possible problems of your router and ensure"
TUForm_FirstUseAgreementContent_ImprovementPlan5="the normal and stable operation of your router, we will collect and store the following information of your router: Device MAC address, negotiation rate, RSSI, restart case, CPE FOTA start and end time, registration successful case, signal strength, network type change, drop network case, PDP connect and disconnect case, CELL handover, network cable plugging time.\nWe will use your personal data in the following way: After the data is collected, when you send your product for repair, we will export the data at the product after-sales maintenance site and transmit the data to the after-sales service center to locate the problem. This function is disabled by"
TUForm_FirstUseAgreementContent_ImprovementPlan6="default, and will take effect only after you agree to enable it. If you choose to enable it, you can disable it through the "Advanced Setting ->System Setting-> After-Sales Improvement Plan" on the webui management page. Meanwhile, we will delete the local data of your device.\nIf you do not provide the data, it is difficult to locate the cause of the problem if you encounter some occasional problems, which affects your use of the product. It is strongly recommended that you enable this function.\nThe above data are stored on the after-sales management server deployed in ZTE, and the European server is deployed in Frankfurt,"
TUForm_FirstUseAgreementContent_ImprovementPlan7="Germany. The personal data collected and generated in the People's Republic of China is stored in the People's Republic of China. Your data is preferentially stored on the server in the corresponding region. If you need to locate faults, you may transfer your data from the collection location to the server in China for fault analysis. If you agree to this Privacy Policy, it means that you agree to transfer your information across borders. To ensure that this service can be provided for you within the warranty period, the above data will be saved for two years and will be deleted after expiration.\nIf we want to use the information for other purposes not specified in this"
TUForm_FirstUseAgreementContent_ImprovementPlan8="policy, we will seek your approval in advance. If we want to use the information collected for specific purposes for other purposes, we will seek your approval in advance.\nII. How we share, transfer and disclose your personal information\nTo ensure the security of your personal information, we shall follow the minimization principle and share, transfer, or disclose your personal information in accordance with applicable laws and requirements.\nFor the companies, organizations, and individuals that share personal information with us, we will take organizational and technical measures in accordance with the local laws and regulations, and require them to"
TUForm_FirstUseAgreementContent_ImprovementPlan9="process personal information in accordance with our security standards, this policy, and related confidentiality and security measures.\n1. Sharing\nWe will not share your personal information with any company, organization, or individuals other than ZTE Corporation and its subsidiaries, except in the following cases:\n(1) After obtaining your explicit consent, we will share your personal information with other parties.\n(2) We may share your personal information in accordance with laws and regulations or mandatory requirements of government authorities.\n2. Transfer"
TUForm_FirstUseAgreementContent_ImprovementPlan10="We will not transfer your personal information to any company, organization or individual except in the following cases:\n(1) Transfer with express consent: After obtaining your express consent, we will transfer your personal information to other parties.\n(2) If personal information transfer is involved in a merger, acquisition, or bankruptcy liquidation, we will require new companies or organizations that hold your personal information to continue to be subject to this privacy policy. Otherwise, we will require the companies or organizations to re-request authorization from you.\n3. Public Disclosure\nWe will disclose your personal"
TUForm_FirstUseAgreementContent_ImprovementPlan11="information only in the following cases:\n(1) With your express consent.\n(2) Disclosure based on law: We may disclose your personal information in case of law, legal procedure, litigation, or mandatory requirements of government authorities.\nIII. How we protect your personal information\n1. We have taken the security protection measures that comply with industry standards to protect the personal information provided by you against unauthorized access, public disclosure, use, modification, damage or loss. We will take all reasonable and feasible measures to protect your personal information.\nWe provide the safe browsing mode"
TUForm_FirstUseAgreementContent_ImprovementPlan12="of https for the service. We use encryption technologies to ensure data confidentiality. We use trusted protection mechanisms to prevent data from being maliciously attacked. We will deploy access control mechanisms to ensure that only authorized personnel can access personal information. In addition, we will hold the training course on security and privacy protection to enhance employees' awareness of the importance of personal information protection.\n2. Our data security capabilities:\nWe have been committed to protecting your personal information security.\nWe have taken various security "
TUForm_FirstUseAgreementContent_ImprovementPlan13="measures, such as access control system, monitoring system, encryption, anonymization or pseudonymisation, employee training and so forth, to protect your personal information from unauthorized access, use, disclosure, modification, damage or loss and other forms of illegal processing.\nWe have developed a business continuity plan to ensure that services can be provided continuously. Our information security policies and procedures are designed in strict accordance with international standards, and reviewed and updated regularly, and the effectiveness of the security management architecture and measures is ensured through"
TUForm_FirstUseAgreementContent_ImprovementPlan14="regular third party security audits. ZTE Corporation and some of its subsidiaries have passed the ISO 27001 information security certification, and can effectively protect your personal information. In case of personal information leakage, we will initiate an emergency plan, take effective measures to prevent the situation from getting worse, and notify the relevant supervisory authority and you in a timely manner.\n3. We will take all reasonable and feasible measures to ensure that irrelevant personal information is not collected. We will retain your personal information only for the period required to achieve the objectives specified in this policy, unless the"
TUForm_FirstUseAgreementContent_ImprovementPlan15="retention period needs to be extended or is permitted by law.\n4. The Internet is not absolutely secure, and most communications, such as emails and instant messaging, are not encrypted. We strongly recommend that you do not send personal information through such means. Please use a complicated password to help us ensure the security of your account.\n5. We shall regularly update and publicize the contents related to reporting such as security risks , personal information security impact assessments and so forth . If we affect your personal information rights in security assessment reports, we will actively disclose security risks. "
TUForm_FirstUseAgreementContent_ImprovementPlan16="You can obtain detailed report contents in the following way:\nE-mail: Privacy@zte.com.cn\n6. The Internet environment is not 100 percent secure. We will do our best to ensure or guarantee the security of any information you send us. If our physical, technical or management protection facilities are damaged, which results in unauthorized access, public disclosure, tampering or damage that affects your legal rights and interests, we shall assume the corresponding legal responsibilities.\n7. When personal information security incident occurs, we will inform you of the basic situation and possible impact of the security incident in a timely manner, the measures we have taken"
TUForm_FirstUseAgreementContent_ImprovementPlan17="or will take, suggestions for voluntarily preventing and reducing risks, and remedial measures for you. We will inform you of the incident by email, letter, telephone or pushing notification in a timely manner. If it is difficult to inform the subjects of personal information one by one, we will release the notice in a reasonable and effective manner.\nIn addition, we will actively report the handling of personal information security incidents in accordance with the requirements of the regulatory department.\nIV. Your rights\nIn accordance with personal information protection laws, regulations, standards, and common"
TUForm_FirstUseAgreementContent_ImprovementPlan18="practices in other countries and regions, we guarantee that you have the following rights over your personal information:\n1. Access to your personal information\nYou have the right to access your personal information, except for exceptions as required by laws and regulations. If you want to exercise data access rights, you can send an e-mail to privacy@zte.com.cn, or submit the request by login the data subject right response system: pdsr.zte.com.cn. As long as we do not need to make too many efforts, we will provide you with other personal information generated when you use our products or services.\n2. Correct your personal information"
TUForm_FirstUseAgreementContent_ImprovementPlan19="When you find that your personal information processed by us is incorrect, you have the right to request us to correct it. You can email privacy@zte.com.cn or submit the request by login the data subject right response system: pdsr.zte.com.cn at any time.\n3. Delete your personal information\nYou can submit a request for deleting personal information in the following cases:\n(1) we violated laws and regulations.\n(2) we did not obtain your consent.\n(3) we violated an agreement with you.\n(4) you will not use our products or services any longer, or your account is canceled."
TUForm_FirstUseAgreementContent_ImprovementPlan20="(5) we do not provide products or services for you.\nIf we decide to respond to your deletion request, we will also notify the entities that obtain your personal information from us and require them to delete your personal information in a timely manner, unless required by other laws and regulations, or these entities obtain your independent authorization. After you delete information, we may not immediately delete the corresponding information in the backup system, but we will delete the information during the backup update.\n4. Change the scope of your authorization\nEach business function can be"
TUForm_FirstUseAgreementContent_ImprovementPlan21="implemented only after some basic personal information (refer to the first part in this policy) is obtained. You may grant or withdraw your authorization at any time for the collection and use of additional personal information.\nYou can perform the following operations by yourself:\nYou can close the webui management page by "Advanced Setting ->System Setting-> After-Sales Improvement Plan" and we will delete the local data.\nIf you cannot access this personal information through these links/methods, you can send an e-mail to privacy@zte.com.cn, or submit the request by login the data subject right response system: pdsr.zte.com.cn."
TUForm_FirstUseAgreementContent_ImprovementPlan22="After you withdraw your consent, we will not process the corresponding personal information. However, your decision to withdraw your consent will not affect the previous processing of personal information based on your authorization.\n5. Personal information subjects obtain copies of personal information\nYou have the right to obtain a copy of your personal information.\nUnder the prerequisite that the technology is feasible, for example, data interface matching, we can transmit the copy of your personal information directly to the third party specified by you.\n6. Restrain Automatic decision-making of the information system"
TUForm_FirstUseAgreementContent_ImprovementPlan23="In some business functions, we may make decisions only based on non-manual automatic decision-making mechanisms such as information systems and algorithms. If these decisions have a significant impact on your legal rights and interests, you have the right to ask us for an explanation, and we will provide appropriate relief methods.\n7. Respond to your above requests\nTo ensure security, you may need to provide a written request or prove your identity in other ways. We may ask you to verify your identity before processing your request.\nWe will make every effort to ensure that a response is made within one month since we received your request."
TUForm_FirstUseAgreementContent_ImprovementPlan24="Considering the complexity and quantity of the request, this period may be extended by another two months if necessary. In the case of postponed respond, we will notify you of the relevant circumstances and the reason for the delay. If the time limit set in this paragraph conflicts with local laws and regulations, the local laws and regulations shall prevail.\nIn principle, we do not charge for your reasonable requests, but we will charge for repeated requests that exceed a reasonable limit. We may reject requests that repeat unreasonably, require excessive technical means (for example, development of a new system or a fundamental change of current"
TUForm_FirstUseAgreementContent_ImprovementPlan25="practice), and bring risks to other people's legitimate rights and interests or that are extremely impractical (for example, involving information stored on the backup tape).\nWe will not be able to respond to your request in accordance with laws and regulations if:\n(1) The case is directly related to national security and national defense security.\n(2) The case is directly related to public safety, public health, and major public interests.\n(3) The case is directly related to any criminal investigation, prosecution, trial, and execution of a judgment .\n(4) There is sufficient evidence that"
TUForm_FirstUseAgreementContent_ImprovementPlan26="you have subjective malice or abuse of rights.\n(5) Responding to your request will cause serious damage to the legal rights and interests of yours or other individuals' and organizations'.\n(6) Business secrets are involved.\nV. How we process the personal information of children\nOur products, websites, and services are mainly for adults. Without the consent of parents or guardians, children are not allowed to create their own user accounts.\nIf the personal information of children is collected with the consent of their parents, we will only use or disclose this information with the permit of law,the express consent of parents or"
TUForm_FirstUseAgreementContent_ImprovementPlan27="guardians or the necessary protection of children.\nAlthough local laws and customs define children differently, we regard anyone under 16 as a child.\nIf we find that we have collected personal information of children without obtaining confirmed parental consent, we will try to delete the information as soon as possible.\nVI. How to transfer your personal information around the world\nBecause we provide products or services through resources and servers around the world, as a result,  your  personal information may be transferred to an overseas jurisdiction of the country or area in which the products or services used by you are,"
TUForm_FirstUseAgreementContent_ImprovementPlan28="or may be accessed from these jurisdictions. Any such transfer of  personal information shall take place only in accordance with applicable law.\nWe will take steps designed to comply with all applicable local laws when Processing personal information, including any local law conditions and restrictions on the transfer of  personal information. We may also protect your data through other legally valid methods, including international data transfer agreements.\nVII. GDPR-Specific Provisions\nThe following provisions only apply to you if you live in Europe.\n1.Legal Bases for the Processing of Personal Data"
TUForm_FirstUseAgreementContent_ImprovementPlan29="Our processing of your personal data as described in the Section "How We Collect and Use Your Personal Data" is based on the following legal grounds:\n1.1 Consent: We may process your personal data with your consent. In particular, we may ask for your consent to participate in promotional activities, such as to send you promotional messages or enable you to participate in the User Experience Program and certain Services, including services through which we collect location information. You have the right not to provide consent, or to withdraw it at any time. The withdrawal of your consent does not affect the lawfulness of our use of your personal data before your"
TUForm_FirstUseAgreementContent_ImprovementPlan30="withdrawal. If you have granted us consent to use your personal data, we will use it only for the purposes specified in the consent declaration. Please note that to the extent our processing is based on your consent and you deny your consent or withdraw it, we may not be able to provide the service relating thereto. Besides from that, neither the initial denial nor a withdrawal will have any negative consequences for you.\n1.2 Perform or enter into a contract with you:\nWe rely on this legal basis in particular in the following cases:\n• to provide you with ZTE's Services, process your orders or fulfil the contract between you and ZTE,"
TUForm_FirstUseAgreementContent_ImprovementPlan31="• to activate Services you have purchased, your warranty service and specific software licenses and provide notifications for software updates,\n• to allow and manage your participation in prize draws, contests or similar promotional activities held by us, and\n• to diagnose product issues, repair customer equipment and provide other customer care and support Services.\n1.3 Compliance with a legal obligation: ZTE may be obliged to process personal data to comply with our legal obligations, for example where ZTE is required to retain data for tax law or commercial purposes.\n1.4 Legitimate interests:"
TUForm_FirstUseAgreementContent_ImprovementPlan32=" The processing of your personal data may also be necessary for ZTE's legitimate interests. In particular, such cases may include the following:\n• to conduct customer surveys to enhance your user experience,\n• to analyse the customer market on the basis of the country where you use our Services, including the number of users for product marketing and promotion,\n• to analyse the efficiency of our business operations,\n• to analyse error logs to improve phone quality and app functions,\n• to provide you with personalised Services and to recommend and display content and advertisements tailored to you through our Services,"
TUForm_FirstUseAgreementContent_ImprovementPlan33="• to communicate with you and reply to your questions or comments submitted to us by any means,\n• to ensure the functionality and safety of our Services,\n• to verify your identity,\n• to conduct internal auditing and to prevent and investigate fraud, cybersecurity threats or other improper use,\n• to enhance and develop our Services, including relevant security features, so as to improve the product usage experience, user-friendliness, operational performance, functions and design,\n• to pursue or defend against legal claims.\nYour personal data will only be"
TUForm_FirstUseAgreementContent_ImprovementPlan34="processed on the above grounds after we have appropriately assessed and balanced our interests against your right to privacy.\n2.Additional Information on Your Rights Regarding Personal Data\nSubject to the legal requirements under the GDPR, you have the following rights:\nThe right to access: You may request access to the personal data we hold about you.\nThe right to rectification: If you find that the personal data we process about you is inaccurate or incomplete, you are entitled to ask us to make rectifications without undue delay and to request the completion of your personal data where appropriate."
TUForm_FirstUseAgreementContent_ImprovementPlan35="The right to erasure: You can submit a request to us to delete personal data, and we shall have the obligation to erase it without undue delay in some circumstances – for example, if we do not have a legal reason to continue to process the personal data to the extent required by applicable laws and regulations. Please note in so far as you delete all the data that is contained in your device, this does not mean that you have deleted all data that ZTE collects and processes about you. Therefore, we encourage you to contact us (please refer to the section "Contact Us" ) to request that your personal data is deleted.\nThe right to restriction of processing: You have the right, in certain"
TUForm_FirstUseAgreementContent_ImprovementPlan36="circumstances, to request ZTE to temporarily restrict the processing of your personal data, such as where the accuracy of that personal data is contested by you, while we verify the accuracy of that personal data. We will keep just enough data, or process such data as is necessary to ensure that we comply with your restriction request in the future.\nTHE RIGHT TO OBJECT: You have the right to object to any processing justified by legitimate interests based on grounds relating to your particular situation at any time. Should you decide to object to the processing of your personal data, we will stop processing personal data that concerns you, unless we can"
TUForm_FirstUseAgreementContent_ImprovementPlan37="demonstrate compelling reasons for continuing to process your personal data that override your interests, rights and freedoms, or in the case that we establish, exercise or defend our legal claims. You can object to direct marketing activities at any time for any reason whatsoever.\nThe right to data portability: You have the right to obtain a copy of your personal data in a structured, commonly-used and machine-readable format and transmit such data to another provider or have such data transmitted to another provider under certain circumstances.\nThe right to withdraw consent: If you have given us your consent to process your personal data but change your"
TUForm_FirstUseAgreementContent_ImprovementPlan38="mind later, you have the right to withdraw your consent at any time. The withdrawal of your consent does not affect the lawfulness of our use of your personal data before your withdrawal. If you want to withdraw your consent with regard to receiving promotional communications, you can unsubscribe through the method described in each promotional message. If you withdraw your consent, we may no longer be able to provide you with the corresponding Service.\nThe right to lodge a complaint: You have the right to lodge a complaint with a competent supervisory authority about the way we handle or process your personal data, or file a "
TUForm_FirstUseAgreementContent_ImprovementPlan39="lawsuit in a court with jurisdiction. Information about how to contact your local data protection supervisory authority is available here at https://edpb.europa.eu/about-edpb/board/members_en.\n3.Additional Information on Cross-border transfer\nWe takes steps to ensure that appropriate technical and organizational security measures and safeguards are applied when transferring personal information outside of the EEA and that privacy rights outlined in this Policy are preserved. We has established Standard Contractual Clauses of the EU Commission as providing an adequate level of protection to the"
TUForm_FirstUseAgreementContent_ImprovementPlan40="personal information we Process globally. We ensures that all transfers of Personal Information are subject to appropriate safeguards as defined by the regulation.\nVIII. Notice to California Consumers\nCalifornia consumers have the privacy rights listed below. The rights listed below under the California Consumer Privacy Act and Shine the Light are not the same. To exercise your rights, you will need to follow the directions below that are specific to each law.\nCalifornia Consumer Privacy Act (“CCPA”)\nPlease note that the CCPA provides certain exceptions with respect to the Personal Information that we collect in connection with providing products"
TUForm_FirstUseAgreementContent_ImprovementPlan41="or services to other businesses. Similarly, it does not apply to information we collect in the context of a person’s role as a job applicant, employee or contractor of ZTE. With respect to the Personal Information collected in connection with the above individuals or circumstances, you may not have any or all of the privacy rights listed below.\nCollection, Use and Disclosure of Personal Information in the Past 12 Months\nThe CCPA requires that we make certain disclosures about our general collection, use and disclosure of Personal Information over the past 12 months. Accordingly, in the past 12 months:"
TUForm_FirstUseAgreementContent_ImprovementPlan42="we collected the categories of Personal Information detailed in the policy of how do we collect and use your personal information above.\nwe did not sell Personal Information, as we understand the term “sale” in the CCPA and its implementing regulations.\nwe did not disclosed Personal Information to any entities.\nYou have the right to request to know more specific disclosures about your personal information as detailed under “Request to Know” below. \nCalifornia Privacy Rights\nYou have the following privacy rights under the CCPA:\nRequest to know. You have the right to request to know the following"
TUForm_FirstUseAgreementContent_ImprovementPlan43="information about our practices over the past 12 months: (i) the specific pieces of Personal Information we have collected about you, (ii) the categories of Personal Information we have collected about you, (iii) the categories of sources from which we collected Personal Information about you, (iv) the categories of third parties with which we share Personal Information, (v) the categories of your Personal Information that we sold or disclosed and for each category, the categories of third parties to which we sold or disclosed that particular category of Personal Information, and (vi) our business or commercial purpose for collecting or selling your Personal Information."
TUForm_FirstUseAgreementContent_ImprovementPlan44="You may exercise your right to request to know twice a year, free of charge. If we are unable to fulfill your request to know, we will let you know the reason why. Please note, in response to a request to know, we are prohibited from disclosing your Social Security number, driver’s license number or other government-issued identification number, financial account number, any health insurance or medical identification number, an account password, security questions or answers, unique biometric data generated from measurements or technical analysis of human characteristics.\nRequest to delete. You have the right to request that we delete the"
TUForm_FirstUseAgreementContent_ImprovementPlan45="Personal Information that we have collected from you. We may deny your request under certain circumstances, such as if we need to comply with our legal obligations or complete a transaction for which your Personal Information was collected. If we deny your request to delete, we will let you know the reason why.\nRight to opt-out of the sale of your Personal Information. You have the right to opt out of the sale of your Personal Information. While we never exchange personal information for money or other consideration, the CCPA’s definition of “sale” is very broad and may include the use of services to deliver interest-based ads to you. We do not knowingly sell the"
TUForm_FirstUseAgreementContent_ImprovementPlan46="Personal Information of minors under 13 years old without consent from the minor’s parent or guardian. We do not knowingly sell the Personal Information of minors between 13 and 16 years old without the minor’s own consent. If you do not affirmatively opt out, and you are not a minor, your Personal Information may be sold as disclosed in this privacy policy.\nRight to non-discrimination. If you choose to exercise any of these rights, we will not discriminate against you in any way. If you exercise certain rights, understand that you may be unable to use or access certain features of the app.\nTo make a request to know or a request to delete, contact us at"
TUForm_FirstUseAgreementContent_ImprovementPlan47="001-877-817-1759 or send an e-mail to privacy@zte.com.cn. If you are an authorized agent making a request on behalf of a California resident, contact us at 001-877-817-1759 or send an e-mail to privacy@zte.com.cn.\nTo opt-out of the sale of your Personal Information, contact us at 001-877-817-1759 or send an e-mail to privacy@zte.com.cn. If you are an authorized agent making a request on behalf of a California resident, contact us at 001-877-817-1759 or send an e-mail to privacy@zte.com.cn.\nWe will take steps to verify your identity before processing your request to know or request to delete. We will not fulfill your request unless you have provided sufficient"
TUForm_FirstUseAgreementContent_ImprovementPlan48="information for us to reasonably verify you are the individual about whom we collected Personal Information. If you have an account with us, we will use our existing account authentication practices to verify your identity. If you do not have an account with us, we may request additional information about you so that we can verify your identity. We will only use the Personal Information you provide to verify your identity and to process your request, unless you initially provided the information for another purpose.\nYou may use an authorized agent to submit a request to know or a request to delete. When we verify your agent’s request, we may verify both"
TUForm_FirstUseAgreementContent_ImprovementPlan49="your and your agent’s identity and request a signed document from you that authorizes your agent to make the request on your behalf. To protect your Personal Information, we reserve the right to deny a request from an agent that does not submit proof that they have been authorized by you to act on your behalf.\nShine the Light\nCalifornia consumers may also request information from us once per calendar year about any Personal Information shared with third parties for the third party’s own direct marketing purposes, including the categories of information and the names and addresses of those businesses with which we have shared such"
TUForm_FirstUseAgreementContent_ImprovementPlan50="information. To request this information, please send an e-mail to privacy@zte.com.cn or contact us at 001-877-817-1759. Your inquiry must specify “Shine the Light Request” in the subject line of the email or the first line of the letter, and include your name, street address, city, state and ZIP code.\nIX. How to update this policy\nOur privacy policy may change.\nWithout your express consent, we will not reduce your rights under this privacy policy.\nWe will release any changes to this policy on this page. For major changes, we will also provide more noticeable notifications (including notifications for some services, which will be sent"
TUForm_FirstUseAgreementContent_ImprovementPlan51="via email to describe the specific changes in the privacy policy).\nMajor changes mentioned in this policy include but are not limited to the following situations:\n1. Our service model has significantly changed. For example, the purpose of processing personal information, the type of processed personal information, and the mode of using the personal information.\n2. Major changes have taken place in the ownership structure and organizational structure. Such as changes in owners caused by business adjustment or bankruptcy or mergers and acquisitions.\n3. The major objects of personal information sharing, transfer, or public"
TUForm_FirstUseAgreementContent_ImprovementPlan52="disclosure are changed.\n4. Your right to participate in the processing of personal information and the way you exercise it have changed significantly.\n5. Our responsible department for personal information security, contact method, or complaint channel have changed.\n6. The personal information security impact assessment report indicates a high risk.\nWe will also archive the old version of this policy for your reference.\nX. Contact us\nWe have established a special personal information protection department – Data Protection Compliance Dept.. If you have any"
TUForm_FirstUseAgreementContent_ImprovementPlan53="questions, comments, or suggestions on this privacy policy, please feel free to send an email to us at Privacy @zte.com.cn, which will be replied within at the appropriate time.\nIn addition, you can send letters to the Data Protection Compliance Dept. of ZTE headquarters.\nTo: Data Protection Compliance Dept. of ZTE Corporation\nAddress: 26/F, R&D Building, No. 55, Hi-Tech Road South, Shenzhen, China (Post Code: 518057)\nIf you are unsatisfied with our response, especially when our personal information processing activities have damaged your legal rights and interests, you can seek solutions through the local data"
TUForm_FirstUseAgreementContent_ImprovementPlan54="protection agency.\nFor contact information about personal information supervisory authority in other areas, you can consult the local government. For the contact information of the European Union data protection agency, please refer to: https://ec.europa.eu/justice/article-29/structure/data-protection-authorities/index_en.htm"


