TUForm_FirstUseGDPRTitle_Text="Privacy Policy"
TUForm_FirstUseGDPRContent_Text="To provide you with router system update service and to make sure your router devices work properly, the following information needs to be collected:\nIMEI, SN and software version of router device.\n\nYou may choose to download the latest version and perform update in order to resolve possible risk that the system might have. Meanwhile, you may choose to turn on auto-update feature in order to resolve critical failures that the system might have and to update security patch. This feature is enabled by default. To disable this feature, go to 'Update'>'Automatic Update' on the device, or log in to the product management web page and turn it off in 'Update'>'Auto-check Settings'. Besides, updating version will consume mobile data.\n\nBy tapping ACCEPT you understand and agree to the terms mentioned above. \n\nTo learn more about privacy protection, please read #0f87f7 ZTE Privacy Policy.#"
TUForm_FirstUseGDPRContent_CWMP_Text="To provide you with router system update service and to make sure your router devices work properly, the following information needs to be collected:\nIMEI, SN and software version of router device.\n\nYou may choose to download the latest version and perform update in order to resolve possible risk that the system might have. Meanwhile, you may choose to turn on auto-update feature in order to resolve critical failures that the system might have and to update security patch. This feature is enabled by default. To disable this feature, go to 'Update'>'Automatic Update' on the device, or log in to the product management web page and turn it off in 'Update'>'Auto-check Settings'. Besides, updating version will consume mobile data.\n\nIn order to allow you to use the CWMP (an Internet protocol) to remotely manage your mobile broadband devices, the operator will collect and process some of your personal information. Your information is controlled and processed by the operator, while ZTE provides only the mobile broadband device.\n\nFor more details about your personal information, or any questions about your rights as a data subject or about the processing of your personal data via the operator, please contact the operator.\n\nBy tapping ACCEPT you understand and agree to the terms mentioned above. \n\nTo learn more about privacy protection, please read #0f87f7 ZTE Privacy Policy.#"
TUForm_FirstUseGDPRPopUp_Text="Please login to the Web UI or webpage to confirm via the following link.\n\nhttps://ztedevices.com/en-gl/legal/zte-smart-router-privacy-policy/"
