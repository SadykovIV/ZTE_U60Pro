[package]
name = "zte-agent"
version = "2.7.0-vpn.1"
edition = "2021"
license-file = "../../LICENSE-SCOPE.md"

[features]
default = []
esim = []

[[bin]]
name = "zte-agent"
path = "src/main.rs"

[[bin]]
name = "zte-agent-esim"
path = "src/esim_main.rs"
required-features = ["esim"]

[dependencies]
process-runner = { path = "../process-runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
sha2 = "0.10"
libc = "0.2"
